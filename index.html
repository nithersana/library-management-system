// ═══════════════════════════════════════════════════════════════
// ANIMATED CANVAS: 5 FLOATING GRADIENT ORBS
// ═══════════════════════════════════════════════════════════════
function CanvasOrbs() {
  useEffect(() => {
    const canvas = document.getElementById('orbCanvas');
    const ctx = canvas.getContext('2d');
    let w = (canvas.width = window.innerWidth), h = (canvas.height = window.innerHeight);
    const onResize = () => { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; };
    window.addEventListener('resize', onResize);

    const orbs = [
      { x: w * 0.2, y: h * 0.25, r: 340, vx: 0.35, vy: 0.25, color: '#3D1A78' },
      { x: w * 0.8, y: h * 0.3, r: 400, vx: -0.28, vy: 0.3, color: '#1A237E' },
      { x: w * 0.5, y: h * 0.7, r: 360, vx: 0.22, vy: -0.28, color: '#4A148C' },
      { x: w * 0.15, y: h * 0.8, r: 310, vx: 0.3, vy: -0.22, color: '#0D47A1' },
      { x: w * 0.85, y: h * 0.85, r: 350, vx: -0.25, vy: -0.25, color: '#1B0036' }
    ];

    let animId;
    function render() {
      ctx.fillStyle = '#0B0B1A';
      ctx.fillRect(0, 0, w, h);
      orbs.forEach(orb => {
        orb.x += orb.vx; orb.y += orb.vy;
        if (orb.x - orb.r * 0.4 < 0 || orb.x + orb.r * 0.4 > w) orb.vx *= -1;
        if (orb.y - orb.r * 0.4 < 0 || orb.y + orb.r * 0.4 > h) orb.vy *= -1;
        const grad = ctx.createRadialGradient(orb.x, orb.y, 0, orb.x, orb.y, orb.r);
        grad.addColorStop(0, orb.color + 'BF');
        grad.addColorStop(0.5, orb.color + '4D');
        grad.addColorStop(1, 'transparent');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(orb.x, orb.y, orb.r, 0, Math.PI * 2);
        ctx.fill();
      });
      animId = requestAnimationFrame(render);
    }
    render();
    return () => { cancelAnimationFrame(animId); window.removeEventListener('resize', onResize); };
  }, []);
  return null;
}

// ═══════════════════════════════════════════════════════════════
// ANIMATED COUNT-UP NUMBER
// ═══════════════════════════════════════════════════════════════
function AnimatedCount({ target, prefix = '', suffix = '' }) {
  const [count, setCount] = useState(0);
  useEffect(() => {
    let start = 0; const end = parseInt(target, 10) || 0;
    if (end === 0) { setCount(0); return; }
    const duration = 750, startTime = performance.now();
    const update = (now) => {
      const progress = Math.min((now - startTime) / duration, 1);
      const ease = 1 - Math.pow(1 - progress, 3);
      setCount(Math.floor(start + (end - start) * ease));
      if (progress < 1) requestAnimationFrame(update); else setCount(end);
    };
    requestAnimationFrame(update);
  }, [target]);
  return <span>{prefix}{count}{suffix}</span>;
}

// ═══════════════════════════════════════════════════════════════
// SORTABLE TABLE HOOK
// ═══════════════════════════════════════════════════════════════
function useSortableData(items, config = null) {
  const [sortConfig, setSortConfig] = useState(config);
  const sortedItems = useMemo(() => {
    let sortable = [...items];
    if (sortConfig !== null) {
      sortable.sort((a, b) => {
        let aVal = a[sortConfig.key], bVal = b[sortConfig.key];
        if (typeof aVal === 'string') aVal = aVal.toLowerCase();
        if (typeof bVal === 'string') bVal = bVal.toLowerCase();
        if (aVal < bVal) return sortConfig.direction === 'ascending' ? -1 : 1;
        if (aVal > bVal) return sortConfig.direction === 'ascending' ? 1 : -1;
        return 0;
      });
    }
    return sortable;
  }, [items, sortConfig]);

  const requestSort = (key) => {
    let direction = 'ascending';
    if (sortConfig && sortConfig.key === key && sortConfig.direction === 'ascending') direction = 'descending';
    setSortConfig({ key, direction });
  };
  const getSortIcon = (key) => (!sortConfig || sortConfig.key !== key ? ' ⇅' : sortConfig.direction === 'ascending' ? ' ↑' : ' ↓');
  return { items: sortedItems, requestSort, getSortIcon };
}

function FloatingInput({ label, type = 'text', value, onChange, error, required = false, ...props }) {
  const isValid = value && String(value).trim().length > 0 && !error;
  return (
    <div className="floating-input-wrap">
      <input type={type} value={value} onChange={onChange} placeholder=" " className="floating-input" {...props}/>

      {error && <p className="text-xs text-[#FF5252] mt-1 pl-1 font-medium">{error}</p>}
    </div>
  );
}

function Modal({ isOpen, onClose, title, children, maxWidth = 'max-w-lg' }) {
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    if (isOpen) window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [isOpen, onClose]);
  if (!isOpen) return null;
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
      <div className="absolute inset-0 bg-[#0B0B1A]/70 backdrop-blur-md" onClick={onClose}/>
      <div className={`relative w-full ${maxWidth} glass-modal p-6 z-10 overflow-hidden`}>

  };

  const switchTab = (tab) => {
    setProgressWidth(35);
    setTimeout(() => setProgressWidth(75), 90);
    setTimeout(() => {
      setActiveTab(tab); setProgressWidth(100); setMobileDrawerOpen(false);
      setTimeout(() => setProgressWidth(0), 220);
    }, 180);
  };

  const handleLogin = (user) => {
    setCurrentUser(user);
    setActiveTab('dashboard');
    showToast(`Welcome back, ${user.name}!`, 'success', 'Terminal Access');
    logActivity('User Access', `${user.name} logged in`);
  };

  const handleLogout = () => {
    setCurrentUser(null);
    showToast('Session ended successfully.', 'warning');
  };

  const overdueCount = useMemo(() => {
    const today = getTodayStr();
    return loans.filter((l) => l.status === 'ACTIVE' && l.dueDate < today).length;
  }, [loans]);

  // ─────────────────────────────────────────────────────────────
  // MODAL STATES
  // ─────────────────────────────────────────────────────────────
  const [bookModalOpen, setBookModalOpen] = useState(false);
  const [editingBook, setEditingBook] = useState(null);
  const [bookForm, setBookForm] = useState({ isbn: '', title: '', author: '', category: '', copies: 1 });
  const [bookErrors, setBookErrors] = useState({});

  const [issueMemberId, setIssueMemberId] = useState('');
  const [issueBookIsbn, setIssueBookIsbn] = useState('');

  const [returnModalOpen, setReturnModalOpen] = useState(false);
  const [selectedLoanReturn, setSelectedLoanReturn] = useState(null);

  const [memberModalOpen, setMemberModalOpen] = useState(false);
  const [memberForm, setMemberForm] = useState({ name: '', username: '', password: '', memberType: 'Student', email: '' });
  const [memberErrors, setMemberErrors] = useState({});

  // Search Filters
  const [bookSearch, setBookSearch] = useState('');
  const [memberSearch, setMemberSearch] = useState('');
  const [returnSearch, setReturnSearch] = useState('');

  // ─────────────────────────────────────────────────────────────
  // HANDLERS
  // ─────────────────────────────────────────────────────────────
  const handleSaveBook = (e) => {
    e.preventDefault();
    const errs = {};
    if (!bookForm.isbn.trim()) errs.isbn = 'ISBN required';
    if (!bookForm.title.trim()) errs.title = 'Title required';
    if (!bookForm.author.trim()) errs.author = 'Author required';
    if (!bookForm.category.trim()) errs.category = 'Category required';
    if (!bookForm.copies || bookForm.copies < 1) errs.copies = 'Minimum 1 copy';
    if (Object.keys(errs).length) { setBookErrors(errs); return; }

    if (editingBook) {
      const diff = parseInt(bookForm.copies, 10) - editingBook.totalCopies;
      setBooks((prev) => prev.map((b) => b.isbn === editingBook.isbn ? {
        ...b, title: bookForm.title, author: bookForm.author, category: bookForm.category,
        totalCopies: parseInt(bookForm.copies, 10), availableCopies: Math.max(0, b.availableCopies + diff)
      } : b));
      showToast(`Updated "${bookForm.title}" successfully.`);
      logActivity('Book Updated', `Modified copies of ${bookForm.title}`);
    } else {
      if (books.some((b) => b.isbn === bookForm.isbn.trim())) { setBookErrors({ isbn: 'ISBN already exists' }); return; }
      setBooks((prev) => [{
        isbn: bookForm.isbn.trim(), title: bookForm.title.trim(), author: bookForm.author.trim(),
        category: bookForm.category.trim(), totalCopies: parseInt(bookForm.copies, 10), availableCopies: parseInt(bookForm.copies, 10)
      }, ...prev]);
      showToast(`Added "${bookForm.title}" to catalogue.`);
      logActivity('Book Added', `New book ${bookForm.title} added`);
    }
    setBookModalOpen(false);
  };

  const handleDeleteBook = (isbn) => {
    if (loans.some((l) => l.bookIsbn === isbn && l.status === 'ACTIVE')) {
      showToast('Cannot delete book with active loans.', 'danger'); return;
    }
    const b = books.find((x) => x.isbn === isbn);
    setBooks((prev) => prev.filter((x) => x.isbn !== isbn));
    showToast(`Removed "${b?.title}".`, 'warning');
    logActivity('Book Deleted', `Deleted ${b?.title}`);
  };

  const handleIssueBook = (e) => {
    e.preventDefault();
    if (!issueMemberId || !issueBookIsbn) { showToast('Select both member and book.', 'warning'); return; }
    const m = users.find((u) => u.id === issueMemberId);
    const b = books.find((x) => x.isbn === issueBookIsbn);
    if (!m || !b) return;

    if (b.availableCopies <= 0) { showToast(`No copies available for "${b.title}".`, 'danger'); return; }
    const activeCount = loans.filter((l) => l.memberId === m.id && l.status === 'ACTIVE').length;
    const limit = m.maxBooks || settings.maxBooksDefault;
    if (activeCount >= limit) { showToast(`${m.name} reached max limit of ${limit} books!`, 'danger'); return; }

    const loanId = `LN${loanCounter}`; setLoanCounter((c) => c + 1);
    const today = getTodayStr(), dueDate = addDays(today, 15);
    setLoans((prev) => [{
      id: loanId, memberId: m.id, memberName: m.name, membershipId: m.membershipId,
      bookIsbn: b.isbn, bookTitle: b.title, issueDate: today, dueDate, status: 'ACTIVE'
    }, ...prev]);
    setBooks((prev) => prev.map((x) => x.isbn === b.isbn ? { ...x, availableCopies: x.availableCopies - 1 } : x));
    showToast(`Issued "${b.title}" to ${m.name}! Due: ${dueDate}`, 'success');
    logActivity('Book Issued', `${loanId}: ${b.title} issued to ${m.name}`);
    setIssueMemberId(''); setIssueBookIsbn('');
  };

  const handleConfirmReturn = (payFineImmediately = false) => {
    if (!selectedLoanReturn) return;
    const loan = selectedLoanReturn, today = getTodayStr();
    const overdueDays = getDiffDays(loan.dueDate, today);
    const fine = overdueDays > 0 ? overdueDays * settings.fineRate : 0;

    if (fine > 0) {
      const fineId = `FN${fineCounter}`; setFineCounter((c) => c + 1);
      setFines((prev) => [{
        id: fineId, loanId: loan.id, memberId: loan.memberId, memberName: loan.memberName,
        bookTitle: loan.bookTitle, amount: fine, status: payFineImmediately ? 'SETTLED' : 'UNPAID', date: today
      }, ...prev]);
    }
    setLoans((prev) => prev.map((l) => l.id === loan.id ? { ...l, status: 'RETURNED', returnDate: today } : l));
    setBooks((prev) => prev.map((b) => b.isbn === loan.bookIsbn ? { ...b, availableCopies: b.availableCopies + 1 } : b));

    const pendingRes = reservations.find((r) => r.bookIsbn === loan.bookIsbn && r.status === 'PENDING');
    if (pendingRes) showToast(`Pending reservation exists for "${loan.bookTitle}" by ${pendingRes.memberName}!`, 'warning', 'Hold Alert');
    else showToast(`"${loan.bookTitle}" returned successfully!`, 'success');

    logActivity('Book Returned', `Loan ${loan.id} returned`);
    setReturnModalOpen(false); setSelectedLoanReturn(null);
  };

  const handleRegisterMember = (e) => {
    e.preventDefault();
    const errs = {};
    if (!memberForm.name.trim()) errs.name = 'Full name required';
    if (!memberForm.username.trim()) errs.username = 'Username required';
    if (!memberForm.password.trim() || memberForm.password.length < 4) errs.password = 'Min 4 characters';
    if (!memberForm.email.trim() || !memberForm.email.includes('@')) errs.email = 'Valid email required';
    if (users.some((u) => u.username.toLowerCase() === memberForm.username.trim().toLowerCase())) errs.username = 'Username taken';
    if (Object.keys(errs).length) { setMemberErrors(errs); return; }

    const num = users.filter((u) => u.role === 'MEMBER').length + 1;
    const membershipId = `M00${num}`;
    const newMember = {
      id: `u_${Date.now()}`, username: memberForm.username.trim(), password: memberForm.password.trim(),
      name: memberForm.name.trim(), membershipId, memberType: memberForm.memberType,
      maxBooks: memberForm.memberType === 'Faculty' ? 5 : 3, role: 'MEMBER', email: memberForm.email.trim()
    };
    setUsers((p) => [...p, newMember]);
    showToast(`Registered member ${newMember.name} (${membershipId})!`);
    logActivity('Member Registered', `${newMember.name} joined`);
    setMemberModalOpen(false);
    setMemberForm({ name: '', username: '', password: '', memberType: 'Student', email: '' });
  };

  const handleReserveBook = (book) => {
    const existing = reservations.find((r) => r.bookIsbn === book.isbn && r.status === 'PENDING');
    if (existing) { showToast(`A reservation is already placed for "${book.title}".`, 'warning'); return; }
    const resId = `RV${reservationCounter}`; setReservationCounter((c) => c + 1);
    setReservations((prev) => [{
      id: resId, memberId: currentUser?.id || 'guest', memberName: currentUser?.name || 'Dr. Sarah Connor',
      bookIsbn: book.isbn, bookTitle: book.title, date: getTodayStr(), status: 'PENDING'
    }, ...prev]);
    showToast(`Reserved "${book.title}" (${resId})!`, 'success');
    logActivity('Book Reserved', `Reservation ${resId} created for ${book.title}`);
  };

  const handleCancelReservation = (id) => {
    setReservations((prev) => prev.map((r) => r.id === id ? { ...r, status: 'CANCELLED' } : r));
    showToast('Reservation cancelled.', 'warning');
    logActivity('Reservation Cancelled', `${id} cancelled`);
  };

  // Filtered Items
  const filteredBooks = useMemo(() => books.filter((b) =>
    b.title.toLowerCase().includes(bookSearch.toLowerCase()) ||
    b.author.toLowerCase().includes(bookSearch.toLowerCase()) ||
    b.category.toLowerCase().includes(bookSearch.toLowerCase()) ||
    b.isbn.includes(bookSearch)
  ), [books, bookSearch]);
  const { items: sortedBooks, requestSort: sortBooks, getSortIcon: getBookSortIcon } = useSortableData(filteredBooks);

  const filteredMembers = useMemo(() => users.filter((u) => u.role === 'MEMBER').filter((m) =>
    m.name.toLowerCase().includes(memberSearch.toLowerCase()) ||
    m.membershipId?.toLowerCase().includes(memberSearch.toLowerCase())
  ), [users, memberSearch]);
  const { items: sortedMembers, requestSort: sortMembers, getSortIcon: getMemberSortIcon } = useSortableData(filteredMembers);

  const activeLoansList = useMemo(() => loans.filter((l) => l.status === 'ACTIVE').filter((l) =>
    l.bookTitle.toLowerCase().includes(returnSearch.toLowerCase()) ||
    l.memberName.toLowerCase().includes(returnSearch.toLowerCase()) ||
    l.id.toLowerCase().includes(returnSearch.toLowerCase())
  ), [loans, returnSearch]);
  const { items: sortedActiveLoans, requestSort: sortActiveLoans, getSortIcon: getLoanSortIcon } = useSortableData(activeLoansList);

  const { items: sortedReservations, requestSort: sortReservations, getSortIcon: getResSortIcon } = useSortableData(reservations);

  // App Navigation: 7 Core Management Pages (+ Login = 8 total)
  const navItems = [
    { id: 'dashboard', label: 'Dashboard', icon: '📊' },
    { id: 'books', label: 'Manage Books', icon: '📚' },
    { id: 'issue', label: 'Issue Book', icon: '📤' },
    { id: 'return', label: 'Return Book', icon: '📥', badge: overdueCount > 0 ? overdueCount : null },
    { id: 'members', label: 'Manage Members', icon: '👥' },
    { id: 'reservations', label: 'Reservations', icon: '🔖' },
    { id: 'reports', label: 'Reports & Audit', icon: '📈' }
  ];

  return (
    <div className="relative w-full h-full flex flex-col overflow-hidden select-none">
      <CanvasOrbs />
      <div className="page-progress-bar" style={{ width: `${progressWidth}%`, opacity: progressWidth > 0 ? 1 : 0 }}/>

      {/* Toasts */}
      <div className="fixed top-5 right-5 z-50 flex flex-col gap-2.5 pointer-events-none max-w-sm w-full">
        {toasts.map((t) => (
          <div key={t.id} className="pointer-events-auto p-4 rounded-2xl glass-card flex items-center justify-between shadow-2xl border"
            style={{
              borderColor: t.type === 'success' ? 'rgba(105, 240, 174, 0.4)' : t.type === 'danger' ? 'rgba(255, 82, 82, 0.4)' : 'rgba(255, 215, 64, 0.4)',
              background: 'rgba(20, 15, 35, 0.95)'
            }}>
            <div className="flex items-center gap-3">
              <span className="text-xl">{t.type === 'success' ? '✨' : t.type === 'danger' ? '⚠️' : '🔔'}</span>
              <div>
                <p className="text-xs font-bold" style={{ color: t.type === 'success' ? '#69F0AE' : t.type === 'danger' ? '#FF5252' : '#FFD740' }}>{t.title || 'Notice'}</p>
                <p className="text-xs text-[#F3E5F5]/90">{t.message}</p>
              </div>
            </div>
            <button onClick={() => setToasts((prev) => prev.filter((x) => x.id !== t.id))} className="text-white/60 hover:text-white ml-2 text-base">✕</button>
          </div>
        ))}
      </div>

      {/* ─────────────────────────────────────────────────────────────
          PAGE 1: LOGIN SCREEN
      ───────────────────────────────────────────────────────────── */}
      {!currentUser ? (
        <div className="relative z-10 w-full h-full flex items-center justify-center p-4">
          <div className="w-full max-w-md glass-modal p-8 md:p-10 text-center animate-fade-in shadow-2xl">
            <div className="w-16 h-16 mx-auto mb-4 rounded-2xl bg-gradient-to-tr from-[#9C27B0]/30 to-[#1565C0]/30 border border-white/20 flex items-center justify-center text-3xl shadow-xl shadow-[#9C27B0]/20">
              📖
            </div>
            <h1 className="font-heading text-3xl font-extrabold text-gradient mb-1">LibraryOS</h1>
            <p className="text-xs font-semibold text-[#CE93D8] tracking-wider uppercase mb-7">Dark Glassmorphism Terminal</p>

            <form onSubmit={(e) => {
              e.preventDefault();
              const u = e.target.username.value.trim(), p = e.target.password.value.trim();
              const found = users.find((x) => x.username.toLowerCase() === u.toLowerCase() && x.password === p);
              if (found) handleLogin(found); else showToast('Invalid credentials. Check username/password.', 'danger');
            }} className="text-left">
              <FloatingInput name="username" label="Username" defaultValue="librarian" required />
              <FloatingInput name="password" label="Password" type="password" defaultValue="lib123" required />
              <button type="submit" className="btn-primary w-full py-3.5 text-xs font-bold uppercase tracking-wider mt-2 mb-6">
                Enter Terminal
              </button>
            </form>

            <div className="mb-5">
              <p className="text-[10px] text-[#7B6F8A] font-bold uppercase tracking-wider mb-2">Quick Sign-In Presets</p>
              <div className="flex items-center justify-center gap-2">
                <button onClick={() => handleLogin(users[0])} className="btn-glass-pill px-3 py-1.5 text-xs text-[#CE93D8] hover:text-white">👩‍💼 Librarian</button>
                <button onClick={() => handleLogin(users[1])} className="btn-glass-pill px-3 py-1.5 text-xs text-[#CE93D8] hover:text-white">🎓 Member</button>
                <button onClick={() => handleLogin(users[3])} className="btn-glass-pill px-3 py-1.5 text-xs text-[#CE93D8] hover:text-white">🛡️ Admin</button>
              </div>
            </div>
            <p className="text-[10px] text-[#7B6F8A]">🔒 Single-Page Reactive Data Store • 8 Core Pages</p>
          </div>
        </div>
      ) : (
        <div className="relative z-10 flex h-full w-full overflow-hidden">
          {/* Mobile Backdrop */}
          {mobileDrawerOpen && <div className="fixed inset-0 bg-[#0B0B1A]/80 backdrop-blur-sm z-30 md:hidden" onClick={() => setMobileDrawerOpen(false)}/>}

          {/* Sidebar Navigation */}
          <aside className={`glass-sidebar fixed md:relative z-40 h-full flex flex-col justify-between transition-all duration-300 ${
            mobileDrawerOpen ? 'left-0 w-64' : '-left-full md:left-0'
          } ${sidebarCollapsed ? 'md:w-[70px]' : 'md:w-[260px]'}`}>
            <div>
              <div className="h-16 flex items-center justify-between px-4 border-b border-white/10">
                {!sidebarCollapsed ? (
                  <div className="flex items-center gap-2">
                    <span className="text-2xl drop-shadow-[0_0_8px_rgba(224,64,251,0.6)]">📖</span>
                    <span className="font-heading font-extrabold text-base text-gradient">LibraryOS</span>
                  </div>
                ) : (
                  <span className="text-2xl mx-auto">📖</span>
                )}
                <button onClick={() => setSidebarCollapsed(!sidebarCollapsed)} className="hidden md:flex w-7 h-7 rounded-lg bg-white/5 hover:bg-white/15 text-[#CE93D8] hover:text-white items-center justify-center text-xs">
                  {sidebarCollapsed ? '▶' : '◀'}
                </button>
              </div>

              <nav className="p-3 space-y-1 overflow-y-auto">
                {navItems.map((item) => (
                  <button key={item.id} onClick={() => switchTab(item.id)}
                    className={`w-full flex items-center gap-3.5 px-3.5 py-3 rounded-xl sidebar-item font-medium text-xs transition-all ${
                      activeTab === item.id ? 'active' : 'text-[#CE93D8] hover:text-white hover:bg-white/5'
                    }`}>
                    <span className="text-base shrink-0">{item.icon}</span>
                    {!sidebarCollapsed && <span className="truncate">{item.label}</span>}
                    {!sidebarCollapsed && item.badge && (
                      <span className="ml-auto px-2 py-0.5 rounded-full text-[10px] font-bold bg-[#FF5252] text-white pulse-overdue">{item.badge}</span>
                    )}
                  </button>
                ))}
              </nav>
            </div>

            <div className="p-3 border-t border-white/10">
              <div className="glass-card p-2.5 flex items-center gap-3 rounded-xl">
                <div className="w-8 h-8 shrink-0 rounded-full bg-gradient-to-tr from-[#9C27B0] to-[#1565C0] flex items-center justify-center font-bold text-xs text-white">
                  {currentUser.name.slice(0, 2).toUpperCase()}
                </div>
                {!sidebarCollapsed && (
                  <div className="overflow-hidden">
                    <p className="text-xs font-bold text-white truncate">{currentUser.name}</p>
                    <span className="badge-active text-[9px] py-0 px-2 mt-0.5">{currentUser.role}</span>
                  </div>
                )}
              </div>
            </div>
          </aside>

          {/* Main Workspace */}
          <div className="flex-1 flex flex-col h-full overflow-hidden">
            <header className="glass-header h-16 w-full flex items-center justify-between px-4 md:px-8 z-20 shrink-0">
              <div className="flex items-center gap-3">
                <button onClick={() => setMobileDrawerOpen(!mobileDrawerOpen)} className="md:hidden text-[#CE93D8] p-2 rounded-lg bg-white/5">☰</button>
                <div className="font-heading text-sm md:text-base font-bold text-white">
                  {navItems.find((n) => n.id === activeTab)?.label}
                </div>
              </div>
              <div className="flex items-center gap-4">
                <button onClick={handleLogout} className="btn-glass-pill px-3.5 py-1.5 text-xs font-semibold flex items-center gap-1.5">
                  <span>Logout</span> <span>↳</span>
                </button>
              </div>
            </header>

            <main className="flex-1 overflow-y-auto p-4 md:p-8 animate-fade-in">
              {/* ─────────────────────────────────────────────────────────
                  PAGE 2: DASHBOARD
              ───────────────────────────────────────────────────────── */}
              {activeTab === 'dashboard' && (
                <div className="space-y-6">
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
                    <div className="glass-card glass-card-hover p-6 rounded-2xl flex flex-col justify-between">
                      <div className="flex items-center justify-between text-[#CE93D8]">
                        <span className="text-xs font-bold uppercase">Total Books</span><span className="text-xl">📚</span>
                      </div>
                      <p className="font-heading text-4xl font-extrabold text-gradient my-2">
                        <AnimatedCount target={books.reduce((a, b) => a + b.totalCopies, 0)} />
                      </p>
                      <span className="text-[11px] text-[#7B6F8A]">Copies in library system</span>
                    </div>

                    <div className="glass-card glass-card-hover p-6 rounded-2xl flex flex-col justify-between">
                      <div className="flex items-center justify-between text-[#CE93D8]">
                        <span className="text-xs font-bold uppercase">Available Copies</span><span className="text-xl">✅</span>
                      </div>
                      <p className="font-heading text-4xl font-extrabold text-[#69F0AE] my-2">
                        <AnimatedCount target={books.reduce((a, b) => a + b.availableCopies, 0)} />
                      </p>
                      <span className="text-[11px] text-[#7B6F8A]">Ready for checkout</span>
                    </div>

                    <div className="glass-card glass-card-hover p-6 rounded-2xl flex flex-col justify-between">
                      <div className="flex items-center justify-between text-[#CE93D8]">
                        <span className="text-xs font-bold uppercase">Active Loans</span><span className="text-xl">📤</span>
                      </div>
                      <p className="font-heading text-4xl font-extrabold text-[#448AFF] my-2">
                        <AnimatedCount target={loans.filter((l) => l.status === 'ACTIVE').length} />
                      </p>
                      <span className="text-[11px] text-[#7B6F8A]">Currently issued to patrons</span>
                    </div>

                    <div className="glass-card glass-card-hover p-6 rounded-2xl flex flex-col justify-between">
                      <div className="flex items-center justify-between text-[#CE93D8]">
                        <span className="text-xs font-bold uppercase">Overdue Loans</span><span className="text-xl">⚠️</span>
                      </div>
                      <p className={`font-heading text-4xl font-extrabold my-2 ${overdueCount > 0 ? 'text-[#FF5252]' : 'text-white'}`}>
                        <AnimatedCount target={overdueCount} />
                      </p>
                      <span className="text-[11px] text-[#7B6F8A]">{overdueCount > 0 ? 'Action required' : 'All accounts in good standing'}</span>
                    </div>

                    <div className="glass-card glass-card-hover p-6 rounded-2xl flex flex-col justify-between">
                      <div className="flex items-center justify-between text-[#CE93D8]">
                        <span className="text-xs font-bold uppercase">Total Members</span><span className="text-xl">👥</span>
                      </div>
                      <p className="font-heading text-4xl font-extrabold text-gradient-purple my-2">
                        <AnimatedCount target={users.filter((u) => u.role === 'MEMBER').length} />
                      </p>
                      <span className="text-[11px] text-[#7B6F8A]">Students & Faculty enrolled</span>
                    </div>

                    <div className="glass-card glass-card-hover p-6 rounded-2xl flex flex-col justify-between">
                      <div className="flex items-center justify-between text-[#CE93D8]">

                      </div>
                      <p className="font-heading text-4xl font-extrabold text-[#FFD740] my-2">
                        <AnimatedCount target={fines.filter((f) => f.status === 'SETTLED').reduce((a, b) => a + b.amount, 0)} prefix="₹" />

                    <div className="lg:col-span-2 glass-card p-6 rounded-2xl">

                      <div className="space-y-2.5">

                    <div className="glass-card p-6 rounded-2xl flex flex-col justify-between">
                      <div>
                        <h3 className="font-heading text-sm font-bold text-gradient mb-3 flex items-center gap-2"><span>🚀</span> Quick Shortcuts</h3>
                        <div className="space-y-2.5">
                          <button onClick={() => switchTab('issue')} className="btn-primary w-full py-2.5 text-xs font-bold flex items-center justify-center gap-2">

            <label className="block text-xs font-semibold text-[#CE93D8] mb-1">Membership Quota *</label>
            <select value={memberForm.memberType} onChange={(e) => setMemberForm({ ...memberForm, memberType: e.target.value })} className="glass-select">
              <option value="Student">Student (Max 3 Books)</option>
              <option value="Faculty">Faculty (Max 5 Books)</option>
            </select>
          </div>
          <button type="submit" className="btn-primary w-full py-3 text-xs font-bold uppercase mt-2">Register Member</button>
        </form>
      </Modal>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
