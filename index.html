        </form>
      </Modal>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// MEMBER VIEWS
// ═══════════════════════════════════════════════════════════════
function MemberViews({
  activeTab,
  currentUser,
  setCurrentUser,
  books,
  loans,
  reservations,
  setReservations,
  fines,
  setFines,
  settings,
  showToast,
  reservationCounter,
  setReservationCounter,
  logActivity
}) {
  const [bookSearch, setBookSearch] = useState('');
  const [payModalOpen, setPayModalOpen] = useState(false);
  const [selectedFine, setSelectedFine] = useState(null);
  const [paySuccessAnimation, setPaySuccessAnimation] = useState(false);

  // Profile Edit Modal State
  const [profileModalOpen, setProfileModalOpen] = useState(false);
  const [profileEmail, setProfileEmail] = useState(currentUser.email || '');
  const [profilePassword, setProfilePassword] = useState('');

  // Member Loan Calculations
  const myLoans = useMemo(() => loans.filter((l) => l.memberId === currentUser.id), [loans, currentUser]);
  const myActiveLoans = useMemo(() => myLoans.filter((l) => l.status === 'ACTIVE'), [myLoans]);
  const myUnpaidFines = useMemo(
    () => fines.filter((f) => f.memberId === currentUser.id && f.status === 'UNPAID'),
    [fines, currentUser]
  );
  const totalUnpaidAmount = useMemo(
    () => myUnpaidFines.reduce((acc, f) => acc + f.amount, 0),
    [myUnpaidFines]
  );
  const availableSlots = (currentUser.maxBooks || settings.maxBooksDefault) - myActiveLoans.length;

  // Search filter
  const filteredBooks = useMemo(() => {
    return books.filter(
      (b) =>
        b.title.toLowerCase().includes(bookSearch.toLowerCase()) ||
        b.author.toLowerCase().includes(bookSearch.toLowerCase()) ||
        b.category.toLowerCase().includes(bookSearch.toLowerCase())
    );
  }, [books, bookSearch]);

  // Reserve Book Handler
  const handleReserve = (book) => {
    if (!settings.reservationEnabled) {
      showToast('Reservation system is currently disabled by Admin.', 'warning');
      return;
    }
    const alreadyReserved = reservations.some(
      (r) => r.memberId === currentUser.id && r.bookIsbn === book.isbn && r.status === 'PENDING'
    );
    if (alreadyReserved) {
      showToast(`You already have a pending reservation for "${book.title}".`, 'warning');
      return;
    }

    const nextId = `RV${reservationCounter}`;
    setReservationCounter((c) => c + 1);

    const newRes = {
      id: nextId,
      memberId: currentUser.id,
      memberName: currentUser.name,
      bookIsbn: book.isbn,
      bookTitle: book.title,
      date: getTodayStr(),
      status: 'PENDING'
    };

    setReservations((prev) => [newRes, ...prev]);
    showToast(`Reserved "${book.title}"! We'll notify you when available.`, 'success');
    logActivity('Book Reserved', `${currentUser.name} reserved ${book.title}`);
  };

  // Borrow Request Notification
  const handleBorrowRequest = (book) => {
    showToast(`Borrow request submitted for "${book.title}". Visit librarian desk to collect!`, 'success');
    logActivity('Borrow Request', `${currentUser.name} requested copy of ${book.title}`);
  };

  // Cancel Reservation
  const handleCancelReservation = (id) => {
    setReservations((prev) =>
      prev.map((r) => (r.id === id ? { ...r, status: 'CANCELLED' } : r))
    );
    showToast('Reservation cancelled.', 'warning');
  };

  // Pay Fine Handlers
  const openPayFineModal = (fine) => {
    setSelectedFine(fine);
    setPaySuccessAnimation(false);
    setPayModalOpen(true);
  };

  const handleConfirmPayFine = () => {
    if (!selectedFine) return;
    setPaySuccessAnimation(true);
    setTimeout(() => {
      setFines((prev) =>
        prev.map((f) => (f.id === selectedFine.id ? { ...f, status: 'SETTLED' } : f))
      );
      showToast(`Fine of ₹${selectedFine.amount} cleared successfully!`, 'success');
      logActivity('Fine Paid', `${currentUser.name} paid fine of ₹${selectedFine.amount}`);
      setPayModalOpen(false);
      setSelectedFine(null);
      setPaySuccessAnimation(false);
    }, 900);
  };

  // Profile Save
  const handleSaveProfile = (e) => {
    e.preventDefault();
    const updated = {
      ...currentUser,
      email: profileEmail.trim(),
      ...(profilePassword.trim().length >= 4 ? { password: profilePassword.trim() } : {})
    };
    setCurrentUser(updated);
    showToast('Profile updated successfully!', 'success');
    setProfileModalOpen(false);
  };

  // Personalized Greeting
  const hour = new Date().getHours();
  const greeting = hour < 12 ? 'Good Morning' : hour < 17 ? 'Good Afternoon' : 'Good Evening';

  return (
    <div className="space-y-6">
      {/* ─────────────────────────────────────────────────────────────
          1. HOME
      ───────────────────────────────────────────────────────────── */}
      {activeTab === 'home' && (
        <div className="space-y-6">
          {/* Personalized Welcome Card */}
          <div className="glass-card p-6 md:p-8 rounded-2xl flex flex-col sm:flex-row items-center justify-between gap-6">
            <div>
              <span className="text-xs text-[#CE93D8] font-semibold tracking-wider uppercase">
                {currentUser.memberType} Account • {currentUser.membershipId}
              </span>
              <h2 className="font-heading text-2xl md:text-3xl font-extrabold text-gradient mt-1">
                {greeting}, {currentUser.name}!
              </h2>
              <p className="text-xs text-[#7B6F8A] mt-2">
                Today is {new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' })}
              </p>
            </div>
            <div className="w-16 h-16 rounded-2xl bg-gradient-to-tr from-[#9C27B0]/40 to-[#1565C0]/40 flex items-center justify-center text-3xl shadow-xl shadow-[#9C27B0]/20 border border-white/20">
              📖
            </div>
          </div>

          {/* Quick Stats Grid */}
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-5">
            <div className="glass-card glass-card-hover p-6 rounded-2xl">
              <span className="text-xs text-[#CE93D8] font-semibold uppercase">Currently Borrowed</span>
              <p className="font-heading text-3xl font-extrabold text-white my-2">
                <AnimatedCount target={myActiveLoans.length} />
              </p>
              <span className="text-[11px] text-[#7B6F8A]">Active book loans</span>
            </div>

            <div className="glass-card glass-card-hover p-6 rounded-2xl">
              <span className="text-xs text-[#CE93D8] font-semibold uppercase">Available Slots</span>
              <p className="font-heading text-3xl font-extrabold text-[#69F0AE] my-2">
                <AnimatedCount target={Math.max(0, availableSlots)} />
              </p>
              <span className="text-[11px] text-[#7B6F8A]">
                Quota: {currentUser.maxBooks || settings.maxBooksDefault} max books
              </span>
            </div>

            <div className="glass-card glass-card-hover p-6 rounded-2xl">
              <span className="text-xs text-[#CE93D8] font-semibold uppercase">Pending Fines</span>
              <p
                className={`font-heading text-3xl font-extrabold my-2 ${
                  totalUnpaidAmount > 0 ? 'text-[#FF5252]' : 'text-white'
                }`}
              >
                <AnimatedCount target={totalUnpaidAmount} prefix="₹" />
              </p>
              <span className="text-[11px] text-[#7B6F8A]">
                {totalUnpaidAmount > 0 ? 'Settle in Fines tab' : 'No dues pending'}
              </span>
            </div>
          </div>

          {/* Mini Table: My Active Loans */}
          <div className="glass-card p-6 rounded-2xl space-y-4">
            <h3 className="font-heading text-base font-bold text-white flex items-center gap-2">
              <span>📚</span> Current Books on Loan
            </h3>
            {myActiveLoans.length === 0 ? (
              <div className="p-8 text-center text-[#7B6F8A]">
                <p className="text-sm">You have no active loans right now.</p>
              </div>
            ) : (
              <div className="overflow-x-auto">
                <table>
                  <thead>
                    <tr>
                      <th>Title</th>
                      <th>Issued</th>
                      <th>Due Date</th>
                      <th>Status</th>
                    </tr>
                  </thead>
                  <tbody>
                    {myActiveLoans.map((loan) => {
                      const isOverdue = loan.dueDate < getTodayStr();
                      return (
                        <tr key={loan.id} className={isOverdue ? 'bg-red-500/[0.06]' : ''}>
                          <td className="font-semibold text-white">{loan.bookTitle}</td>
                          <td className="text-xs text-[#7B6F8A]">{loan.issueDate}</td>
                          <td className="text-xs font-semibold text-white">{loan.dueDate}</td>
                          <td>
                            {isOverdue ? (
                              <span className="badge-overdue">OVERDUE</span>
                            ) : (
                              <span className="badge-active">ACTIVE</span>
                            )}
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        </div>
      )}

      {/* ─────────────────────────────────────────────────────────────
          2. SEARCH BOOKS
      ───────────────────────────────────────────────────────────── */}
      {activeTab === 'search' && (
        <div className="space-y-6">
          <div className="glass-card p-6 rounded-2xl flex flex-col sm:flex-row items-center justify-between gap-4">
            <div>
              <h2 className="font-heading text-xl font-bold text-gradient">Search Catalogue</h2>
              <p className="text-xs text-[#7B6F8A]">Live search across all library titles and disciplines</p>
            </div>
            <div className="w-full sm:w-80">
              <input
                type="text"
                placeholder="🔍 Search title, author, category..."
                value={bookSearch}
                onChange={(e) => setBookSearch(e.target.value)}
                className="w-full px-4 py-2.5 rounded-xl bg-white/[0.06] border border-white/10 text-white outline-none focus:border-[#E040FB] text-xs"
              />
            </div>
          </div>

          {/* Book Cards Grid */}
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
            {filteredBooks.length === 0 ? (
              <div className="col-span-full glass-card p-12 text-center text-[#7B6F8A]">
                <span className="text-4xl block mb-2">🔍</span>
                <p className="text-sm">No books found matching "{bookSearch}"</p>
              </div>
            ) : (
              filteredBooks.map((book) => {
                const isAvailable = book.availableCopies > 0;
                return (
                  <div
                    key={book.isbn}
                    className="glass-card glass-card-hover p-5 rounded-2xl flex flex-col justify-between"
                  >
                    <div>
                      <div className="flex items-center justify-between mb-3">
                        <span className="px-2.5 py-0.5 rounded-full text-[10px] font-semibold bg-white/10 text-[#CE93D8]">
                          {book.category}
                        </span>
                        <span className={isAvailable ? 'badge-active' : 'badge-overdue'}>
                          {isAvailable ? `${book.availableCopies} available` : '0 copies'}
                        </span>
                      </div>
                      <h4 className="font-heading text-sm font-bold text-white mb-1 leading-snug">
                        {book.title}
                      </h4>
                      <p className="text-xs text-[#7B6F8A] mb-4">{book.author}</p>
                    </div>

                    <div className="pt-3 border-t border-white/5">
                      {isAvailable ? (
                        <button
                          onClick={() => handleBorrowRequest(book)}
                          className="btn-primary w-full py-2 text-xs font-semibold"
                        >
                          Request Copy
                        </button>
                      ) : (
                        <button
                          onClick={() => handleReserve(book)}
                          className="btn-secondary w-full py-2 text-xs font-semibold"
                        >
                          Reserve Book
                        </button>
                      )}
                    </div>
                  </div>
                );
              })
            )}
          </div>
        </div>
      )}

      {/* ─────────────────────────────────────────────────────────────
          3. MY LOANS
      ───────────────────────────────────────────────────────────── */}
      {activeTab === 'loans' && (
        <div className="glass-card p-6 rounded-2xl space-y-6">
          <div>
            <h2 className="font-heading text-xl font-bold text-gradient">My Borrowing History</h2>
            <p className="text-xs text-[#7B6F8A]">Complete record of active and returned books</p>
          </div>

          <div className="overflow-x-auto rounded-xl">
            {myLoans.length === 0 ? (
              <div className="p-12 text-center text-[#7B6F8A]">
                <span className="text-4xl block mb-2">📖</span>
                <p className="text-sm">No loans recorded on this account</p>
              </div>
            ) : (
              <table>
                <thead>
                  <tr>
                    <th>Loan ID</th>
                    <th>Book Title</th>
                    <th>Issue Date</th>
                    <th>Due Date</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody>
                  {myLoans.map((loan) => {
                    const isOverdue = loan.status === 'ACTIVE' && loan.dueDate < getTodayStr();
                    return (
                      <tr key={loan.id} className={isOverdue ? 'bg-red-500/[0.06]' : ''}>
                        <td className="font-mono text-xs text-[#CE93D8]">{loan.id}</td>
                        <td className="font-semibold text-white">{loan.bookTitle}</td>
                        <td className="text-xs text-[#7B6F8A]">{loan.issueDate}</td>
                        <td className="text-xs font-semibold text-white">{loan.dueDate}</td>
                        <td>
                          {loan.status === 'RETURNED' ? (
                            <span className="badge-returned">RETURNED</span>
                          ) : isOverdue ? (
                            <span className="badge-overdue">OVERDUE</span>
                          ) : (
                            <span className="badge-active">ACTIVE</span>
                          )}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            )}
          </div>
        </div>
      )}

      {/* ─────────────────────────────────────────────────────────────
          4. RESERVATIONS
      ───────────────────────────────────────────────────────────── */}
      {activeTab === 'reservations' && (
        <div className="glass-card p-6 rounded-2xl space-y-6">
          <div>
            <h2 className="font-heading text-xl font-bold text-gradient">My Reservations</h2>
            <p className="text-xs text-[#7B6F8A]">Track pending holds and reservations</p>
          </div>

          <div className="overflow-x-auto rounded-xl">
            {reservations.filter((r) => r.memberId === currentUser.id).length === 0 ? (
              <div className="p-12 text-center text-[#7B6F8A]">
                <span className="text-4xl block mb-2">🔖</span>
                <p className="text-sm">You have no active reservations</p>
              </div>
            ) : (
              <table>
                <thead>
                  <tr>
                    <th>Reservation ID</th>
                    <th>Book Title</th>
                    <th>Date Placed</th>
                    <th>Status</th>
                    <th className="text-right">Action</th>
                  </tr>
                </thead>
                <tbody>
                  {reservations
                    .filter((r) => r.memberId === currentUser.id)
                    .map((r) => (
                      <tr key={r.id}>
                        <td className="font-mono text-xs text-[#CE93D8]">{r.id}</td>
                        <td className="font-semibold text-white">{r.bookTitle}</td>
                        <td className="text-xs text-[#7B6F8A]">{r.date}</td>
                        <td>
                          {r.status === 'PENDING' ? (
                            <span className="badge-pending">PENDING</span>
                          ) : (
                            <span className="badge-returned">CANCELLED</span>
                          )}
                        </td>
                        <td className="text-right">
                          {r.status === 'PENDING' && (
                            <button
                              onClick={() => handleCancelReservation(r.id)}
                              className="btn-danger px-3 py-1 text-xs"
                            >
                              Cancel
                            </button>
                          )}
                        </td>
                      </tr>
                    ))}
                </tbody>
              </table>
            )}
          </div>
        </div>
      )}

      {/* ─────────────────────────────────────────────────────────────
          5. FINES
      ───────────────────────────────────────────────────────────── */}
      {activeTab === 'fines' && (
        <div className="glass-card p-6 rounded-2xl space-y-6">
          <div className="flex items-center justify-between">
            <div>
              <h2 className="font-heading text-xl font-bold text-gradient">Fines & Dues</h2>
              <p className="text-xs text-[#7B6F8A]">Clear penalties incurred on overdue books</p>
            </div>
            {totalUnpaidAmount > 0 && (
              <div className="px-4 py-2 rounded-xl bg-red-500/10 border border-red-500/20 text-xs font-bold text-[#FF5252]">
                Total Unpaid: ₹{totalUnpaidAmount}
              </div>
            )}
          </div>

          <div className="overflow-x-auto rounded-xl">
            {fines.filter((f) => f.memberId === currentUser.id).length === 0 ? (
              <div className="p-12 text-center text-[#7B6F8A]">
                <span className="text-4xl block mb-2">🎉</span>
                <p className="text-sm">No fine records on your account!</p>
              </div>
            ) : (
              <table>
                <thead>
                  <tr>
                    <th>Fine ID</th>
                    <th>Book</th>
                    <th>Date Assessed</th>
                    <th>Amount</th>
                    <th>Status</th>
                    <th className="text-right">Action</th>
                  </tr>
                </thead>
                <tbody>
                  {fines
                    .filter((f) => f.memberId === currentUser.id)
                    .map((f) => {
                      const isUnpaid = f.status === 'UNPAID';
                      return (
                        <tr
                          key={f.id}
                          className={isUnpaid ? 'border border-red-500/30 bg-red-500/[0.04]' : ''}
                        >
                          <td className="font-mono text-xs text-[#CE93D8]">{f.id}</td>
                          <td className="font-semibold text-white">{f.bookTitle}</td>
                          <td className="text-xs text-[#7B6F8A]">{f.date}</td>
                          <td className="font-bold text-[#FF5252]">₹{f.amount}</td>
                          <td>
                            {isUnpaid ? (
                              <span className="badge-overdue">UNPAID</span>
                            ) : (
                              <span className="badge-active">SETTLED</span>
                            )}
                          </td>
                          <td className="text-right">
                            {isUnpaid && (
                              <button
                                onClick={() => openPayFineModal(f)}
                                className="btn-primary px-3 py-1 text-xs"
                              >
                                Pay Fine
                              </button>
                            )}
                          </td>
                        </tr>
                      );
                    })}
                </tbody>
              </table>
            )}
          </div>
        </div>
      )}

      {/* ─────────────────────────────────────────────────────────────
          6. PROFILE
      ───────────────────────────────────────────────────────────── */}
      {activeTab === 'profile' && (
        <div className="max-w-xl mx-auto glass-card p-8 rounded-2xl space-y-6">
          <div className="flex items-center gap-4 pb-6 border-b border-white/10">
            <div className="w-16 h-16 rounded-full bg-gradient-to-tr from-[#9C27B0] to-[#1565C0] flex items-center justify-center font-bold text-xl text-white shadow-xl shadow-[#9C27B0]/30 border border-white/20">
              {currentUser.name
                .split(' ')
                .map((n) => n[0])
                .join('')
                .toUpperCase()
                .slice(0, 2)}
            </div>
            <div>
              <h2 className="font-heading text-xl font-bold text-white">{currentUser.name}</h2>
              <span className="badge-active text-xs">{currentUser.memberType} Member</span>
            </div>
          </div>

          <div className="space-y-3 text-xs">
            <div className="flex justify-between py-2 border-b border-white/5">
              <span className="text-[#7B6F8A] font-semibold">Membership ID</span>
              <span className="text-white font-mono">{currentUser.membershipId}</span>
            </div>
            <div className="flex justify-between py-2 border-b border-white/5">
              <span className="text-[#7B6F8A] font-semibold">Username</span>
              <span className="text-white">{currentUser.username}</span>
            </div>
            <div className="flex justify-between py-2 border-b border-white/5">
              <span className="text-[#7B6F8A] font-semibold">Email</span>
              <span className="text-white">{currentUser.email || 'Not specified'}</span>
            </div>
            <div className="flex justify-between py-2 border-b border-white/5">
              <span className="text-[#7B6F8A] font-semibold">Borrow Limit</span>
              <span className="text-white">
                {currentUser.maxBooks || settings.maxBooksDefault} Books Max
              </span>
            </div>
          </div>

          <button
            onClick={() => setProfileModalOpen(true)}
            className="btn-primary w-full py-3 text-xs font-bold uppercase mt-4"
          >
            Edit Profile Credentials
          </button>
        </div>
      )}

      {/* ─────────────────────────────────────────────────────────────
          MODAL: PAY FINE CONFIRMATION
      ───────────────────────────────────────────────────────────── */}
      <Modal isOpen={payModalOpen} onClose={() => setPayModalOpen(false)} title="Settle Outstanding Fine">
        {selectedFine && (
          <div className="space-y-5 text-center">
            {paySuccessAnimation ? (
              <div className="py-8 animate-fade-in">
                <div className="w-16 h-16 mx-auto rounded-full bg-[#69F0AE]/20 border-2 border-[#69F0AE] flex items-center justify-center text-3xl shadow-xl shadow-[#69F0AE]/40 animate-bounce">
                  ✓
                </div>
                <h4 className="font-heading text-lg font-bold text-[#69F0AE] mt-3">
                  Payment Confirmed!
                </h4>
                <p className="text-xs text-[#7B6F8A]">Fine marked as settled.</p>
              </div>
            ) : (
              <>
                <div className="p-4 rounded-xl bg-white/[0.03] border border-white/10 text-left space-y-1">
                  <p className="text-xs text-[#7B6F8A]">Fine For</p>
                  <p className="text-sm font-bold text-white">{selectedFine.bookTitle}</p>
                  <p className="text-xs text-[#CE93D8]">Reference: {selectedFine.id}</p>
                </div>

                <div className="my-4">
                  <span className="text-xs text-[#7B6F8A] block mb-1">Amount Due</span>
                  <span className="font-heading text-4xl font-extrabold text-[#FFD740]">
                    ₹{selectedFine.amount}
                  </span>
                </div>

                <button
                  onClick={handleConfirmPayFine}
                  className="btn-primary w-full py-3 text-xs font-bold uppercase tracking-wider"
                >
                  Confirm & Pay ₹{selectedFine.amount}
                </button>
              </>
            )}
          </div>
        )}
      </Modal>

      {/* ─────────────────────────────────────────────────────────────
          MODAL: EDIT PROFILE
      ───────────────────────────────────────────────────────────── */}
      <Modal
        isOpen={profileModalOpen}
        onClose={() => setProfileModalOpen(false)}
        title="Edit Profile"
      >
        <form onSubmit={handleSaveProfile} className="space-y-4">
          <FloatingInput
            label="Email Address"
            type="email"
            value={profileEmail}
            onChange={(e) => setProfileEmail(e.target.value)}
            required
          />
          <FloatingInput
            label="New Password (leave blank to keep current)"
            type="password"
            value={profilePassword}
            onChange={(e) => setProfilePassword(e.target.value)}
          />
          <button type="submit" className="btn-primary w-full py-3 text-xs font-bold uppercase mt-4">
            Save Changes
          </button>
        </form>
      </Modal>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// ADMIN VIEWS
// ═══════════════════════════════════════════════════════════════
function AdminViews({
  activeTab,
  users,
  setUsers,
  books,
  loans,
  fines,
  reservations,
  settings,
  setSettings,
  showToast,
  logActivity
}) {
  const [userTab, setUserTab] = useState('LIBRARIANS');
  const [createModalOpen, setCreateModalOpen] = useState(false);
  const [form, setForm] = useState({ name: '', username: '', password: '', role: 'LIBRARIAN', memberType: 'Student' });
  const [settingsForm, setSettingsForm] = useState({ ...settings });

  // Create User Handler
  const handleCreateUser = (e) => {
    e.preventDefault();
    if (!form.name.trim() || !form.username.trim() || !form.password.trim()) {
      showToast('All fields required.', 'danger');
      return;
    }

    if (users.some((u) => u.username.toLowerCase() === form.username.trim().toLowerCase())) {
      showToast('Username already taken.', 'danger');
      return;
    }

    const newUser = {
      id: `u_${Date.now()}`,
      name: form.name.trim(),
      username: form.username.trim(),
      password: form.password.trim(),
      role: form.role,
      ...(form.role === 'MEMBER'
        ? {
            membershipId: `M00${users.filter((u) => u.role === 'MEMBER').length + 1}`,
            memberType: form.memberType,
            maxBooks: form.memberType === 'Faculty' ? 5 : 3
          }
        : {})
    };

    setUsers((prev) => [...prev, newUser]);
    showToast(`Account created for ${newUser.name} (${newUser.role})!`);
    logActivity('Account Created', `Admin created ${newUser.role} user ${newUser.username}`);
    setCreateModalOpen(false);
    setForm({ name: '', username: '', password: '', role: 'LIBRARIAN', memberType: 'Student' });
  };

  // Delete User Handler
  const handleDeleteUser = (id) => {
    const target = users.find((u) => u.id === id);
    if (target?.username === 'admin' || target?.username === 'librarian') {
      showToast('System root accounts cannot be deleted.', 'danger');
      return;
    }
    setUsers((prev) => prev.filter((u) => u.id !== id));
    showToast(`Deleted account ${target?.name}.`, 'warning');
    logActivity('Account Deleted', `Admin removed user ${target?.username}`);
  };

  // Save System Settings
  const handleSaveSettings = (e) => {
    e.preventDefault();
    setSettings(settingsForm);
    showToast('System configuration saved.', 'success');
    logActivity('Settings Modified', 'Admin updated system configuration parameters');
  };

  return (
    <div className="space-y-6">
      {/* ─────────────────────────────────────────────────────────────
          1. USER MANAGEMENT
      ───────────────────────────────────────────────────────────── */}
      {activeTab === 'users' && (
        <div className="glass-card p-6 rounded-2xl space-y-6">
          <div className="flex flex-col sm:flex-row items-center justify-between gap-4">
            <div>
              <h2 className="font-heading text-xl font-bold text-gradient">User Accounts</h2>
              <p className="text-xs text-[#7B6F8A]">
                Provision and audit staff and patron credentials
              </p>
            </div>
            <button
              onClick={() => setCreateModalOpen(true)}
              className="btn-primary py-2 px-4 text-xs font-bold"
            >
              + Create Account
            </button>
          </div>

          {/* Sub-tabs: Librarians vs Members */}
          <div className="flex gap-2 border-b border-white/10 pb-2">
            <button
              onClick={() => setUserTab('LIBRARIANS')}
              className={`px-4 py-1.5 rounded-xl text-xs font-bold transition-colors ${
                userTab === 'LIBRARIANS' ? 'bg-[#9C27B0]/30 text-white border border-[#9C27B0]/50' : 'text-[#7B6F8A] hover:text-white'
              }`}
            >
              Librarians ({users.filter((u) => u.role === 'LIBRARIAN').length})
            </button>
            <button
              onClick={() => setUserTab('MEMBERS')}
              className={`px-4 py-1.5 rounded-xl text-xs font-bold transition-colors ${
                userTab === 'MEMBERS' ? 'bg-[#9C27B0]/30 text-white border border-[#9C27B0]/50' : 'text-[#7B6F8A] hover:text-white'
              }`}
            >
              Members ({users.filter((u) => u.role === 'MEMBER').length})
            </button>
          </div>

          <div className="overflow-x-auto rounded-xl">
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Username</th>
                  <th>Role</th>
                  {userTab === 'MEMBERS' && <th>Membership ID</th>}
                  {userTab === 'MEMBERS' && <th>Type</th>}
                  <th className="text-right">Action</th>
                </tr>
              </thead>
              <tbody>
                {users
                  .filter((u) => u.role === (userTab === 'LIBRARIANS' ? 'LIBRARIAN' : 'MEMBER'))
                  .map((u) => (
                    <tr key={u.id}>
                      <td className="font-semibold text-white">{u.name}</td>
                      <td className="font-mono text-xs text-[#CE93D8]">{u.username}</td>
                      <td>
                        <span className="badge-active">{u.role}</span>
                      </td>
                      {userTab === 'MEMBERS' && (
                        <td className="font-mono text-xs text-[#CE93D8]">{u.membershipId}</td>
                      )}
                      {userTab === 'MEMBERS' && (
                        <td>
                          <span className="px-2.5 py-0.5 rounded-full text-[10px] font-semibold bg-white/10 text-[#CE93D8]">
                            {u.memberType}
                          </span>
                        </td>
                      )}
                      <td className="text-right">
                        {u.username !== 'admin' && u.username !== 'librarian' && (
                          <button
                            onClick={() => handleDeleteUser(u.id)}
                            className="btn-danger px-3 py-1 text-xs"
                          >
                            Delete
                          </button>
                        )}
                      </td>
                    </tr>
                  ))}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {/* ─────────────────────────────────────────────────────────────
          2. SYSTEM SETTINGS
      ───────────────────────────────────────────────────────────── */}
      {activeTab === 'settings' && (
        <div className="max-w-2xl mx-auto glass-card p-8 rounded-2xl space-y-6">
          <div>
            <h2 className="font-heading text-xl font-bold text-gradient">System Configuration</h2>
            <p className="text-xs text-[#7B6F8A]">Global operational parameters and rules</p>
          </div>

          <form onSubmit={handleSaveSettings} className="space-y-6">
            <div className="space-y-4">
              <FloatingInput
                label="Library System Name"
                value={settingsForm.systemName}
                onChange={(e) => setSettingsForm({ ...settingsForm, systemName: e.target.value })}
                required
              />

              <FloatingInput
                label="Fine Rate Per Day (₹)"
                type="number"
                min="0"
                value={settingsForm.fineRate}
                onChange={(e) =>
                  setSettingsForm({ ...settingsForm, fineRate: parseInt(e.target.value, 10) || 0 })
                }
                required
              />

              <FloatingInput
                label="Default Max Books Per Member"
                type="number"
                min="1"
                value={settingsForm.maxBooksDefault}
                onChange={(e) =>
                  setSettingsForm({
                    ...settingsForm,
                    maxBooksDefault: parseInt(e.target.value, 10) || 1
                  })
                }
                required
              />

              {/* Toggles */}
              <div className="flex items-center justify-between p-4 rounded-xl bg-white/[0.03] border border-white/5">
                <div>
                  <p className="text-sm font-semibold text-white">Enable Book Reservations</p>
                  <p className="text-xs text-[#7B6F8A]">Allow members to reserve checked-out copies</p>
                </div>
                <input
                  type="checkbox"
                  checked={settingsForm.reservationEnabled}
                  onChange={(e) =>
                    setSettingsForm({ ...settingsForm, reservationEnabled: e.target.checked })
                  }
                  className="w-5 h-5 accent-[#9C27B0] cursor-pointer"
                />
              </div>

              <div className="flex items-center justify-between p-4 rounded-xl bg-white/[0.03] border border-white/5">
                <div>
                  <p className="text-sm font-semibold text-white">Auto Fine Calculation</p>
                  <p className="text-xs text-[#7B6F8A]">Calculate daily fines on overdue loan returns</p>
                </div>
                <input
                  type="checkbox"
                  checked={settingsForm.autoFineCalculation}
                  onChange={(e) =>
                    setSettingsForm({ ...settingsForm, autoFineCalculation: e.target.checked })
                  }
                  className="w-5 h-5 accent-[#9C27B0] cursor-pointer"
                />
              </div>
            </div>

            <button type="submit" className="btn-primary w-full py-3.5 text-xs font-bold uppercase mt-6">
              Save Settings
            </button>
          </form>
        </div>
      )}

      {/* ─────────────────────────────────────────────────────────────
          3. FULL SYSTEM REPORTS
      ───────────────────────────────────────────────────────────── */}
      {activeTab === 'reports' && (
        <div className="space-y-6">
          <div className="flex items-center justify-between no-print">
            <div>
              <h2 className="font-heading text-xl font-bold text-gradient">Comprehensive Audit Report</h2>
              <p className="text-xs text-[#7B6F8A]">Full system database state and audit logs</p>
            </div>
            <button
              onClick={() => window.print()}
              className="btn-primary py-2.5 px-5 text-xs font-bold flex items-center gap-2"
            >
              <span>🖨️</span> Print Master Audit
            </button>
          </div>

          {/* Quick Metrics */}
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
            <div className="glass-card p-4 rounded-xl">
              <span className="text-[11px] text-[#7B6F8A] uppercase font-bold">Total Titles</span>
              <p className="font-heading text-2xl font-extrabold text-white mt-1">{books.length}</p>
            </div>
            <div className="glass-card p-4 rounded-xl">
              <span className="text-[11px] text-[#7B6F8A] uppercase font-bold">Total Loans</span>
              <p className="font-heading text-2xl font-extrabold text-[#448AFF] mt-1">{loans.length}</p>
            </div>
            <div className="glass-card p-4 rounded-xl">
              <span className="text-[11px] text-[#7B6F8A] uppercase font-bold">Total Fines Assessed</span>
              <p className="font-heading text-2xl font-extrabold text-[#FFD740] mt-1">
                ₹{fines.reduce((acc, f) => acc + f.amount, 0)}
              </p>
            </div>
            <div className="glass-card p-4 rounded-xl">
              <span className="text-[11px] text-[#7B6F8A] uppercase font-bold">Total Users</span>
              <p className="font-heading text-2xl font-extrabold text-gradient-purple mt-1">{users.length}</p>
            </div>
          </div>

          {/* Loans History Table */}
          <div className="glass-card p-6 rounded-2xl space-y-4">
            <h3 className="font-heading text-base font-bold text-white">Full Loan History</h3>
            <div className="overflow-x-auto">
              <table>
                <thead>
                  <tr>
                    <th>Loan ID</th>
                    <th>Member</th>
                    <th>Book</th>
                    <th>Issued</th>
                    <th>Due</th>
                    <th>Status</th>
                  </tr>
                </thead>
                <tbody>
                  {loans.map((l) => (
                    <tr key={l.id}>
                      <td className="font-mono text-xs text-[#CE93D8]">{l.id}</td>
                      <td>{l.memberName}</td>
                      <td>{l.bookTitle}</td>
                      <td className="text-xs text-[#7B6F8A]">{l.issueDate}</td>
                      <td className="text-xs">{l.dueDate}</td>
                      <td>
                        <span className={l.status === 'ACTIVE' ? 'badge-active' : 'badge-returned'}>
                          {l.status}
                        </span>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      )}

      {/* ─────────────────────────────────────────────────────────────
          MODAL: CREATE USER
      ───────────────────────────────────────────────────────────── */}
      <Modal isOpen={createModalOpen} onClose={() => setCreateModalOpen(false)} title="Create New Account">
        <form onSubmit={handleCreateUser} className="space-y-4">
          <FloatingInput
            label="Full Name"
            value={form.name}
            onChange={(e) => setForm({ ...form, name: e.target.value })}
            required
          />
          <FloatingInput
            label="Username"
            value={form.username}
            onChange={(e) => setForm({ ...form, username: e.target.value })}
            required
          />
          <FloatingInput
            label="Password"
            type="password"
            value={form.password}
            onChange={(e) => setForm({ ...form, password: e.target.value })}
            required
          />
          <div>
            <label className="block text-xs font-semibold text-[#CE93D8] mb-1">Role *</label>
            <select
              value={form.role}
              onChange={(e) => setForm({ ...form, role: e.target.value })}
              className="glass-select"
            >
              <option value="LIBRARIAN">Librarian</option>
              <option value="MEMBER">Member</option>
            </select>
          </div>
          {form.role === 'MEMBER' && (
            <div>
              <label className="block text-xs font-semibold text-[#CE93D8] mb-1">Member Type *</label>
              <select
                value={form.memberType}
                onChange={(e) => setForm({ ...form, memberType: e.target.value })}
                className="glass-select"
              >
                <option value="Student">Student (3 books)</option>
                <option value="Faculty">Faculty (5 books)</option>
              </select>
            </div>
          )}
          <button type="submit" className="btn-primary w-full py-3 text-xs font-bold uppercase mt-4">
            Create Account
          </button>
        </form>
      </Modal>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// RENDER ROOT
// ═══════════════════════════════════════════════════════════════
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
