const { useState, useEffect, useRef, useMemo, useCallback } = React;

// Helper Date Utilities
const getTodayStr = () => new Date().toISOString().split('T')[0];
const addDays = (dateStr, days) => {
  const d = new Date(dateStr);
  d.setDate(d.getDate() + days);
  return d.toISOString().split('T')[0];
};
const getDiffDays = (dueStr, todayStr = getTodayStr()) => {
  const d1 = new Date(dueStr);
  const d2 = new Date(todayStr);
  return Math.ceil((d2 - d1) / (1000 * 60 * 60 * 24));
};

// ═══════════════════════════════════════════════════════════════
// ANIMATED CANVAS: 5 FLOATING GRADIENT ORBS
// ═══════════════════════════════════════════════════════════════
function CanvasOrbs() {
  useEffect(() => {
    const canvas = document.getElementById('orbCanvas');
    const ctx = canvas.getContext('2d');
    let width = (canvas.width = window.innerWidth);
    let height = (canvas.height = window.innerHeight);

    const onResize = () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    };
    window.addEventListener('resize', onResize);

    const orbs = [
      { x: width * 0.2, y: height * 0.2, r: 350, vx: 0.35, vy: 0.25, color: '#3D1A78' },
      { x: width * 0.8, y: height * 0.3, r: 420, vx: -0.28, vy: 0.32, color: '#1A237E' },
      { x: width * 0.5, y: height * 0.7, r: 380, vx: 0.22, vy: -0.3, color: '#4A148C' },
      { x: width * 0.15, y: height * 0.8, r: 320, vx: 0.3, vy: -0.22, color: '#0D47A1' },
      { x: width * 0.85, y: height * 0.85, r: 360, vx: -0.25, vy: -0.28, color: '#1B0036' }
    ];

    let animId;
    function render() {
      ctx.fillStyle = '#0B0B1A';
      ctx.fillRect(0, 0, width, height);

      // Draw orbs with soft radial gradients
      orbs.forEach(orb => {
        orb.x += orb.vx;
        orb.y += orb.vy;

        // Bounce gently inside viewport bounds
        if (orb.x - orb.r * 0.4 < 0 || orb.x + orb.r * 0.4 > width) orb.vx *= -1;
        if (orb.y - orb.r * 0.4 < 0 || orb.y + orb.r * 0.4 > height) orb.vy *= -1;

        const grad = ctx.createRadialGradient(orb.x, orb.y, 0, orb.x, orb.y, orb.r);
        grad.addColorStop(0, orb.color + 'BF'); // ~75% opacity center
        grad.addColorStop(0.5, orb.color + '4D'); // ~30% opacity
        grad.addColorStop(1, 'transparent');

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(orb.x, orb.y, orb.r, 0, Math.PI * 2);
        ctx.fill();
      });

      animId = requestAnimationFrame(render);
    }
    render();

    return () => {
      cancelAnimationFrame(animId);
      window.removeEventListener('resize', onResize);
    };
  }, []);

  return null;
}

// ═══════════════════════════════════════════════════════════════
// ANIMATED COUNT-UP NUMBER HOOK
// ═══════════════════════════════════════════════════════════════
function AnimatedCount({ target, prefix = '', suffix = '' }) {
  const [count, setCount] = useState(0);

  useEffect(() => {
    let start = 0;
    const end = parseInt(target, 10) || 0;
    if (end === 0) {
      setCount(0);
      return;
    }
    const duration = 800; // ms
    const startTime = performance.now();

    const updateCount = (currentTime) => {
      const elapsed = currentTime - startTime;
      const progress = Math.min(elapsed / duration, 1);
      // Ease out cubic
      const easeProgress = 1 - Math.pow(1 - progress, 3);
      setCount(Math.floor(start + (end - start) * easeProgress));

      if (progress < 1) {
        requestAnimationFrame(updateCount);
      } else {
        setCount(end);
      }
    };

    requestAnimationFrame(updateCount);
  }, [target]);

  return <span>{prefix}{count}{suffix}</span>;
}

// ═══════════════════════════════════════════════════════════════
// SORTABLE TABLE HOOK
// ═══════════════════════════════════════════════════════════════
function useSortableData(items, config = null) {
  const [sortConfig, setSortConfig] = useState(config);

  const sortedItems = useMemo(() => {
    let sortableItems = [...items];
    if (sortConfig !== null) {
      sortableItems.sort((a, b) => {
        let aVal = a[sortConfig.key];
        let bVal = b[sortConfig.key];
        if (typeof aVal === 'string') aVal = aVal.toLowerCase();
        if (typeof bVal === 'string') bVal = bVal.toLowerCase();
        if (aVal < bVal) return sortConfig.direction === 'ascending' ? -1 : 1;
        if (aVal > bVal) return sortConfig.direction === 'ascending' ? 1 : -1;
        return 0;
      });
    }
    return sortableItems;
  }, [items, sortConfig]);

  const requestSort = (key) => {
    let direction = 'ascending';
    if (sortConfig && sortConfig.key === key && sortConfig.direction === 'ascending') {
      direction = 'descending';
    }
    setSortConfig({ key, direction });
  };

  const getSortIcon = (key) => {
    if (!sortConfig || sortConfig.key !== key) return ' ⇅';
    return sortConfig.direction === 'ascending' ? ' ↑' : ' ↓';
  };

  return { items: sortedItems, requestSort, getSortIcon, sortConfig };
}

// TOAST NOTIFICATIONS
// ═══════════════════════════════════════════════════════════════
function ToastNotification({ toasts, removeToast }) {
  return (
    <div className="fixed top-6 right-6 z-50 flex flex-col gap-3 pointer-events-none max-w-sm w-full">
      {toasts.map((toast) => {
        const isSuccess = toast.type === 'success';
        const isDanger = toast.type === 'error' || toast.type === 'danger';
        const isWarning = toast.type === 'warning';

        return (
          <div
            key={toast.id}
            className="pointer-events-auto p-4 rounded-2xl glass-card flex items-center justify-between shadow-2xl animate-fade-in border"
            style={{
              borderColor: isSuccess ? 'rgba(105, 240, 174, 0.4)' : isDanger ? 'rgba(255, 82, 82, 0.4)' : 'rgba(255, 215, 64, 0.4)',
              background: 'rgba(20, 15, 35, 0.9)'
            }}
          >
            <div className="flex items-center gap-3">
              <span className="text-xl">
                {isSuccess && '✨'}
                {isDanger && '⚠️'}
                {isWarning && '🔔'}
              </span>
              <div>
                <p className="text-sm font-semibold" style={{ color: isSuccess ? '#69F0AE' : isDanger ? '#FF5252' : '#FFD740' }}>
                  {toast.title || (isSuccess ? 'Success' : isDanger ? 'Notice' : 'Alert')}
                </p>
                <p className="text-xs text-[#F3E5F5]/80">{toast.message}</p>
              </div>
            </div>
            <button
              onClick={() => removeToast(toast.id)}
              className="text-muted hover:text-white ml-3 text-lg"
            >
              ×
            </button>
          </div>
        );
      })}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// MODAL WRAPPER
// ═══════════════════════════════════════════════════════════════
function Modal({ isOpen, onClose, title, children, maxWidth = 'max-w-lg' }) {
  useEffect(() => {
    const handleKeyDown = (e) => {
      if (e.key === 'Escape') onClose();
    };
    if (isOpen) {
      window.addEventListener('keydown', handleKeyDown);
    }
    return () => window.removeEventListener('keydown', handleKeyDown);
  }, [isOpen, onClose]);

  if (!isOpen) return null;

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
      {/* Backdrop */}
      <div
        className="absolute inset-0 bg-[#0B0B1A]/70 backdrop-blur-md transition-opacity"
        onClick={onClose}
      />
      {/* Modal Dialog */}
      <div className={`relative w-full ${maxWidth} glass-modal p-6 z-10 overflow-hidden`}>
        <div className="flex items-center justify-between pb-4 border-b border-white/10 mb-5">
          <h3 className="font-heading text-lg font-bold text-gradient">{title}</h3>
          <button
            onClick={onClose}
            className="w-8 h-8 rounded-full flex items-center justify-center text-[#CE93D8] hover:text-white hover:bg-white/10 transition-colors"
          >
            ✕
          </button>
        </div>
        <div>{children}</div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// FLOATING INPUT COMPONENT
// ═══════════════════════════════════════════════════════════════
function FloatingInput({ label, type = 'text', value, onChange, error, required = false, ...props }) {
  const isValid = value && value.trim().length > 0 && !error;

  return (
    <div className="floating-input-wrap">
      <input
        type={type}
        value={value}
        onChange={onChange}
        placeholder=" "
        className="floating-input"
        {...props}
      />
      <label className="floating-label">{label} {required && '*'}</label>
      {isValid && <span className="input-valid-check">✓</span>}
      {error && <p className="text-xs text-[#FF5252] mt-1 pl-1 font-medium">{error}</p>}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// APP MAIN LOGIC & STATE CONTAINER
// ═══════════════════════════════════════════════════════════════
function App() {
  // Authentication & Current User
  const [currentUser, setCurrentUser] = useState(null);

  // App Data (All in Memory)
  const [users, setUsers] = useState(INITIAL_USERS);
  const [books, setBooks] = useState(INITIAL_BOOKS);
  const [loans, setLoans] = useState([]);
  const [reservations, setReservations] = useState([]);
  const [fines, setFines] = useState([]);
  const [recentActivities, setRecentActivities] = useState([
    { id: 1, action: 'System started', detail: 'LibraryOS Dark Glassmorphism initialized', time: 'Just now' }
  ]);

  // System Settings
  const [settings, setSettings] = useState({
    fineRate: 2,
    maxBooksDefault: 3,
    reservationEnabled: true,
    autoFineCalculation: true,
    systemName: 'LibraryOS Premium'
  });

  // UI States
  const [activeTab, setActiveTab] = useState('dashboard');
  const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
  const [mobileDrawerOpen, setMobileDrawerOpen] = useState(false);
  const [progressWidth, setProgressWidth] = useState(0);

  // Counters
  const [loanCounter, setLoanCounter] = useState(1000);
  const [fineCounter, setFineCounter] = useState(100);
  const [reservationCounter, setReservationCounter] = useState(100);

  // Toast System
  const [toasts, setToasts] = useState([]);
  const showToast = useCallback((message, type = 'success', title = '') => {
    const id = Date.now() + Math.random();
    setToasts((prev) => [...prev, { id, message, type, title }]);
    setTimeout(() => {
      setToasts((prev) => prev.filter((t) => t.id !== id));
    }, 3000);
  }, []);

  const removeToast = useCallback((id) => {
    setToasts((prev) => prev.filter((t) => t.id !== id));
  }, []);

  // Add Recent Activity
  const logActivity = useCallback((action, detail) => {
    setRecentActivities((prev) => [
      { id: Date.now(), action, detail, time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) },
      ...prev.slice(0, 4) // keep last 5
    ]);
  }, []);

  // Page Switch Loading Progress Indicator
  const switchTab = (tab) => {
    setProgressWidth(30);
    setTimeout(() => setProgressWidth(70), 100);
    setTimeout(() => {
      setActiveTab(tab);
      setProgressWidth(100);
      setMobileDrawerOpen(false);
      setTimeout(() => setProgressWidth(0), 250);
    }, 200);
  };

  // Login handler
  const handleLogin = (user) => {
    setCurrentUser(user);
    if (user.role === 'LIBRARIAN') setActiveTab('dashboard');
    else if (user.role === 'ADMIN') setActiveTab('users');
    else setActiveTab('home');
    showToast(`Welcome back, ${user.name}!`, 'success', 'Session Active');
    logActivity('User Login', `${user.name} logged in as ${user.role}`);
  };

  // Logout handler
  const handleLogout = () => {
    const name = currentUser?.name;
    setCurrentUser(null);
    showToast('You have been logged out.', 'warning', 'Session Ended');
    if (name) logActivity('User Logout', `${name} signed out`);
  };

  // Count Overdue Loans for badge
  const overdueCount = useMemo(() => {
    const today = getTodayStr();
    return loans.filter((l) => l.status === 'ACTIVE' && l.dueDate < today).length;
  }, [loans]);

  return (
    <div className="relative w-full h-full flex flex-col overflow-hidden select-none">
      <CanvasOrbs />

      {/* Page switch sweep progress bar */}
      <div
        className="page-progress-bar"
        style={{
          width: `${progressWidth}%`,
          opacity: progressWidth > 0 ? 1 : 0
        }}
      />

      {/* Toast Notification Container */}
      <ToastNotification toasts={toasts} removeToast={removeToast} />

      {!currentUser ? (
        <LoginScreen onLogin={handleLogin} users={users} showToast={showToast} />
      ) : (
        <div className="relative z-10 flex h-full w-full overflow-hidden">
          {/* Sidebar */}
          <Sidebar
            user={currentUser}
            activeTab={activeTab}
            setActiveTab={switchTab}
            collapsed={sidebarCollapsed}
            setCollapsed={setSidebarCollapsed}
            mobileOpen={mobileDrawerOpen}
            setMobileOpen={setMobileDrawerOpen}
            overdueCount={overdueCount}
          />

          {/* Main Area */}
          <div className="flex-1 flex flex-col h-full overflow-hidden">
            {/* Header */}
            <Header
              user={currentUser}
              activeTab={activeTab}
              onLogout={handleLogout}
              toggleMobile={() => setMobileDrawerOpen(!mobileDrawerOpen)}
              systemName={settings.systemName}
            />

            {/* Dashboard Content Container */}
            <main className="flex-1 overflow-y-auto p-4 md:p-8 animate-fade-in">
              {currentUser.role === 'LIBRARIAN' && (
                <LibrarianViews
                  activeTab={activeTab}
                  setActiveTab={switchTab}
                  books={books}
                  setBooks={setBooks}
                  users={users}
                  setUsers={setUsers}
                  loans={loans}
                  setLoans={setLoans}
                  reservations={reservations}
                  setReservations={setReservations}
                  fines={fines}
                  setFines={setFines}
                  settings={settings}
                  recentActivities={recentActivities}
                  logActivity={logActivity}
                  showToast={showToast}
                  loanCounter={loanCounter}
                  setLoanCounter={setLoanCounter}
                  fineCounter={fineCounter}
                  setFineCounter={setFineCounter}
                />
              )}

              {currentUser.role === 'MEMBER' && (
                <MemberViews
                  activeTab={activeTab}
                  currentUser={currentUser}
                  setCurrentUser={setCurrentUser}
                  books={books}
                  setBooks={setBooks}
                  loans={loans}
                  setLoans={setLoans}
                  reservations={reservations}
                  setReservations={setReservations}
                  fines={fines}
                  setFines={setFines}
                  settings={settings}
                  showToast={showToast}
                  reservationCounter={reservationCounter}
                  setReservationCounter={setReservationCounter}
                  logActivity={logActivity}
                />
              )}

              {currentUser.role === 'ADMIN' && (
                <AdminViews
                  activeTab={activeTab}
                  users={users}
                  setUsers={setUsers}
                  books={books}
                  loans={loans}
                  fines={fines}
                  reservations={reservations}
                  settings={settings}
                  setSettings={setSettings}
                  showToast={showToast}
                  logActivity={logActivity}
                />
              )}
            </main>
          </div>
        </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// HEADER COMPONENT
// ═══════════════════════════════════════════════════════════════
function Header({ user, activeTab, onLogout, toggleMobile, systemName }) {
  const [timeStr, setTimeStr] = useState('');

  useEffect(() => {
    const updateTime = () => {
      const now = new Date();
      setTimeStr(
        now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }) +
        ' • ' +
        now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })
      );
    };
    updateTime();
    const interval = setInterval(updateTime, 1000);
    return () => clearInterval(interval);
  }, []);

  const formatTitle = (tab) => {
    return tab.replace(/([A-Z])/g, ' $1').replace(/^./, (str) => str.toUpperCase());
  };

  const getInitials = (name) => {
    return name
      ? name
          .split(' ')
          .map((n) => n[0])
          .join('')
          .toUpperCase()
          .slice(0, 2)
      : 'U';
  };

  return (
    <header className="glass-header h-16 w-full flex items-center justify-between px-4 md:px-8 z-20 shrink-0">
      {/* Left: Hamburger (mobile) & Title */}
      <div className="flex items-center gap-3">
        <button
          onClick={toggleMobile}
          className="md:hidden text-[#CE93D8] hover:text-white p-2 rounded-lg bg-white/5"
        >
          ☰
        </button>
        <div className="flex items-center gap-2">
          <span className="text-2xl drop-shadow-[0_0_8px_rgba(224,64,251,0.6)]">📖</span>
          <span className="font-heading text-lg font-extrabold text-gradient hidden sm:inline">
            {systemName}
          </span>
        </div>
      </div>

      {/* Center: Current Page Title */}
      <div className="font-heading text-sm md:text-base font-semibold text-white tracking-wide">
        {formatTitle(activeTab)}
      </div>

      {/* Right: Live time, User Avatar, Logout */}
      <div className="flex items-center gap-4">
        <div className="text-xs text-[#CE93D8]/80 font-medium hidden lg:block">
          {timeStr}
        </div>

        <div className="flex items-center gap-2.5">
          <div className="w-9 h-9 rounded-full bg-gradient-to-tr from-[#9C27B0] to-[#1565C0] flex items-center justify-center font-bold text-xs text-white shadow-lg shadow-[#9C27B0]/30 border border-white/20">
            {getInitials(user.name)}
          </div>
          <div className="hidden sm:block text-left">
            <p className="text-xs font-bold text-white leading-tight">{user.name}</p>
            <span className="text-[10px] font-semibold tracking-wider text-[#CE93D8] uppercase">
              {user.role}
            </span>
          </div>
        </div>

        <button
          onClick={onLogout}
          data-tooltip="Sign out"
          className="btn-glass-pill px-3 py-1.5 text-xs font-semibold flex items-center gap-1.5"
        >
          <span>Logout</span>
          <span>↳</span>
        </button>
      </div>
    </header>
  );
}

// LOGIN SCREEN
// ═══════════════════════════════════════════════════════════════
function LoginScreen({ onLogin, users, showToast }) {
  const [username, setUsername] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');

  const handleSubmit = (e) => {
    e.preventDefault();
    setError('');

    const u = username.trim();
    const p = password.trim();

    const matched = users.find(
      (user) => user.username.toLowerCase() === u.toLowerCase() && user.password === p
    );

    if (matched) {
      onLogin(matched);
    } else {
      setError('Invalid username or password. Please verify credentials.');
      showToast('Authentication failed. Check credentials.', 'danger');
    }
  };

  const fillCredentials = (role) => {
    if (role === 'LIBRARIAN') {
      setUsername('librarian');
      setPassword('lib123');
    } else if (role === 'MEMBER') {
      setUsername('student1');
      setPassword('mem123');
    } else if (role === 'ADMIN') {
      setUsername('admin');
      setPassword('adm123');
    }
  };

  return (
    <div className="relative z-10 w-full h-full flex items-center justify-center p-4">
      <div className="w-full max-w-md glass-modal p-8 md:p-10 text-center animate-fade-in shadow-2xl">
        {/* Glowing Book Icon & Logo */}
        <div className="w-16 h-16 mx-auto mb-4 rounded-2xl bg-gradient-to-tr from-[#9C27B0]/30 to-[#1565C0]/30 border border-white/20 flex items-center justify-center text-3xl shadow-xl shadow-[#9C27B0]/20">
          📖
        </div>
        <h1 className="font-heading text-3xl font-extrabold text-gradient mb-1">
          LibraryOS
        </h1>
        <p className="text-xs font-medium text-[#CE93D8] tracking-wider uppercase mb-8">
          Premium Library Management
        </p>

        {/* Login Form */}
        <form onSubmit={handleSubmit} className="text-left">
          <FloatingInput
            label="Username"
            value={username}
            onChange={(e) => setUsername(e.target.value)}
            required
          />

          <FloatingInput
            label="Password"
            type="password"
            value={password}
            onChange={(e) => setPassword(e.target.value)}
            required
          />

          {error && (
            <p className="text-xs text-[#FF5252] text-center -mt-2 mb-4 font-semibold">
              {error}
            </p>
          )}

          <button
            type="submit"
            className="btn-primary w-full py-3.5 text-sm font-bold tracking-wide uppercase mt-2 mb-6"
          >
            Sign In
          </button>
        </form>

        {/* Preset Quick Login Chips */}
        <div className="mb-6">
          <p className="text-[11px] text-[#7B6F8A] font-semibold uppercase tracking-wider mb-2.5">
            Quick Sign-In Demo Roles
          </p>
          <div className="flex items-center justify-center gap-2">
            <button
              onClick={() => fillCredentials('LIBRARIAN')}
              className="btn-glass-pill px-3 py-1.5 text-xs text-[#CE93D8] hover:text-white"
            >
              👩‍💼 Librarian
            </button>
            <button
              onClick={() => fillCredentials('MEMBER')}
              className="btn-glass-pill px-3 py-1.5 text-xs text-[#CE93D8] hover:text-white"
            >
              🎓 Member
            </button>
            <button
              onClick={() => fillCredentials('ADMIN')}
              className="btn-glass-pill px-3 py-1.5 text-xs text-[#CE93D8] hover:text-white"
            >
              🛡️ Admin
            </button>
          </div>
        </div>

        {/* Bottom Secure Access Note */}
        <div className="text-[11px] text-[#7B6F8A] flex items-center justify-center gap-1.5">
          <span>🔒</span>
          <span>Secure Access — All sessions encrypted in memory</span>
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// LIBRARIAN VIEWS
// ═══════════════════════════════════════════════════════════════
function LibrarianViews({
  activeTab,
  setActiveTab,
  books,
  setBooks,
  users,
  setUsers,
  loans,
  setLoans,
  reservations,
  setReservations,
  fines,
  setFines,
  settings,
  recentActivities,
  logActivity,
  showToast,
  loanCounter,
  setLoanCounter,
  fineCounter,
  setFineCounter
}) {
  // Statistics Calculations
  const totalBooks = useMemo(() => books.reduce((acc, b) => acc + b.totalCopies, 0), [books]);
  const availableBooks = useMemo(() => books.reduce((acc, b) => acc + b.availableCopies, 0), [books]);
  const activeLoans = useMemo(() => loans.filter((l) => l.status === 'ACTIVE').length, [loans]);
  const overdueLoans = useMemo(() => {
    const today = getTodayStr();
    return loans.filter((l) => l.status === 'ACTIVE' && l.dueDate < today).length;
  }, [loans]);
  const totalMembers = useMemo(() => users.filter((u) => u.role === 'MEMBER').length, [users]);
  const finesCollected = useMemo(() => {
    return fines.filter((f) => f.status === 'SETTLED').reduce((acc, f) => acc + f.amount, 0);
  }, [fines]);

  // Book Modal States
  const [bookModalOpen, setBookModalOpen] = useState(false);
  const [editingBook, setEditingBook] = useState(null);
  const [bookForm, setBookForm] = useState({ isbn: '', title: '', author: '', category: '', copies: 1 });
  const [bookErrors, setBookErrors] = useState({});

  // Issue Form States
  const [issueMemberId, setIssueMemberId] = useState('');
  const [issueBookIsbn, setIssueBookIsbn] = useState('');

  // Return Modal State
  const [returnConfirmModal, setReturnConfirmModal] = useState(false);
  const [selectedLoanToReturn, setSelectedLoanToReturn] = useState(null);

  // Member Registration Modal State
  const [memberModalOpen, setMemberModalOpen] = useState(false);
  const [memberForm, setMemberForm] = useState({ name: '', username: '', password: '', memberType: 'Student', email: '' });
  const [memberErrors, setMemberErrors] = useState({});

  // Search Filters
  const [bookSearch, setBookSearch] = useState('');
  const [memberSearch, setMemberSearch] = useState('');
  const [returnSearch, setReturnSearch] = useState('');

  // -------------------------------------------------------------
  // Book CRUD Handlers
  // -------------------------------------------------------------
  const openAddBook = () => {
    setEditingBook(null);
    setBookForm({ isbn: '', title: '', author: '', category: '', copies: 1 });
    setBookErrors({});
    setBookModalOpen(true);
  };

  const openEditBook = (b) => {
    setEditingBook(b);
    setBookForm({ isbn: b.isbn, title: b.title, author: b.author, category: b.category, copies: b.totalCopies });
    setBookErrors({});
    setBookModalOpen(true);
  };

  const handleSaveBook = (e) => {
    e.preventDefault();
    const errs = {};
    if (!bookForm.isbn.trim()) errs.isbn = 'ISBN is required';
    if (!bookForm.title.trim()) errs.title = 'Title is required';
    if (!bookForm.author.trim()) errs.author = 'Author is required';
    if (!bookForm.category.trim()) errs.category = 'Category is required';
    if (!bookForm.copies || bookForm.copies < 1) errs.copies = 'Minimum 1 copy';

    if (Object.keys(errs).length > 0) {
      setBookErrors(errs);
      return;
    }

    if (editingBook) {
      const diff = parseInt(bookForm.copies, 10) - editingBook.totalCopies;
      setBooks((prev) =>
        prev.map((b) =>
          b.isbn === editingBook.isbn
            ? {
                ...b,
                title: bookForm.title,
                author: bookForm.author,
                category: bookForm.category,
                totalCopies: parseInt(bookForm.copies, 10),
                availableCopies: Math.max(0, b.availableCopies + diff)
              }
            : b
        )
      );
      showToast(`Updated "${bookForm.title}" successfully.`);
      logActivity('Book Updated', `Modified copies/details for ${bookForm.title}`);
    } else {
      if (books.some((b) => b.isbn === bookForm.isbn.trim())) {
        setBookErrors({ isbn: 'A book with this ISBN already exists.' });
        return;
      }
      const newBook = {
        isbn: bookForm.isbn.trim(),
        title: bookForm.title.trim(),
        author: bookForm.author.trim(),
        category: bookForm.category.trim(),
        totalCopies: parseInt(bookForm.copies, 10),
        availableCopies: parseInt(bookForm.copies, 10)
      };
      setBooks((prev) => [newBook, ...prev]);
      showToast(`"${bookForm.title}" added to inventory.`);
      logActivity('Book Added', `New book ${bookForm.title} (${bookForm.isbn}) added`);
    }
    setBookModalOpen(false);
  };

  const handleDeleteBook = (isbn) => {
    const book = books.find((b) => b.isbn === isbn);
    const hasActiveLoan = loans.some((l) => l.bookIsbn === isbn && l.status === 'ACTIVE');
    if (hasActiveLoan) {
      showToast(`Cannot delete "${book?.title}". Active loans exist.`, 'danger');
      return;
    }
    setBooks((prev) => prev.filter((b) => b.isbn !== isbn));
    showToast(`Deleted book "${book?.title}".`, 'warning');
    logActivity('Book Deleted', `Removed book ${book?.title} from library`);
  };

  // -------------------------------------------------------------
  // Issue Book Logic
  // -------------------------------------------------------------
  const handleIssueBook = (e) => {
    e.preventDefault();
    if (!issueMemberId || !issueBookIsbn) {
      showToast('Select both a member and a book.', 'warning');
      return;
    }

    const member = users.find((u) => u.id === issueMemberId);
    const book = books.find((b) => b.isbn === issueBookIsbn);

    if (!member || !book) return;

    // Validate available copies
    if (book.availableCopies <= 0) {
      showToast(`No available copies of "${book.title}".`, 'danger');
      return;
    }

    // Validate member borrow limit
    const memberActiveLoans = loans.filter((l) => l.memberId === member.id && l.status === 'ACTIVE').length;
    const maxLimit = member.maxBooks || settings.maxBooksDefault;
    if (memberActiveLoans >= maxLimit) {
      showToast(
        `${member.name} has reached maximum borrowing limit of ${maxLimit} books!`,
        'danger'
      );
      return;
    }

    // Generate Loan
    const nextId = `LN${loanCounter}`;
    setLoanCounter((c) => c + 1);

    const today = getTodayStr();
    const dueDate = addDays(today, 15);

    const newLoan = {
      id: nextId,
      memberId: member.id,
      memberName: member.name,
      membershipId: member.membershipId,
      bookIsbn: book.isbn,
      bookTitle: book.title,
      issueDate: today,
      dueDate: dueDate,
      status: 'ACTIVE'
    };

    setLoans((prev) => [newLoan, ...prev]);

    // Decrement copies
    setBooks((prev) =>
      prev.map((b) => (b.isbn === book.isbn ? { ...b, availableCopies: b.availableCopies - 1 } : b))
    );

    showToast(`Issued "${book.title}" to ${member.name}. Due on ${dueDate}!`, 'success');
    logActivity('Book Issued', `${nextId}: ${book.title} issued to ${member.name}`);

    // Reset Form
    setIssueMemberId('');
    setIssueBookIsbn('');
  };

  // -------------------------------------------------------------
  // Return Book Logic with Confirmation Modal
  // -------------------------------------------------------------
  const promptReturnLoan = (loan) => {
    setSelectedLoanToReturn(loan);
    setReturnConfirmModal(true);
  };

  const handleConfirmReturn = (payFineImmediately = false) => {
    if (!selectedLoanToReturn) return;
    const loan = selectedLoanToReturn;
    const today = getTodayStr();
    const overdueDays = getDiffDays(loan.dueDate, today);
    const calculatedFine = overdueDays > 0 ? overdueDays * settings.fineRate : 0;

    // Check if Fine Record needed
    if (calculatedFine > 0) {
      const nextFineId = `FN${fineCounter}`;
      setFineCounter((c) => c + 1);

      const fineRecord = {
        id: nextFineId,
        loanId: loan.id,
        memberId: loan.memberId,
        memberName: loan.memberName,
        bookTitle: loan.bookTitle,
        amount: calculatedFine,
        status: payFineImmediately ? 'SETTLED' : 'UNPAID',
        date: today
      };

      setFines((prev) => [fineRecord, ...prev]);
    }

    // Mark Loan as Returned
    setLoans((prev) =>
      prev.map((l) => (l.id === loan.id ? { ...l, status: 'RETURNED', returnDate: today } : l))
    );

    // Increment Book Copies
    setBooks((prev) =>
      prev.map((b) => (b.isbn === loan.bookIsbn ? { ...b, availableCopies: b.availableCopies + 1 } : b))
    );

    // Check for pending reservations
    const pendingRes = reservations.find(
      (r) => r.bookIsbn === loan.bookIsbn && r.status === 'PENDING'
    );
    if (pendingRes) {
      showToast(
        `Notice: A pending reservation exists for "${loan.bookTitle}" by ${pendingRes.memberName}!`,
        'warning',
        'Reservation Alert'
      );
    } else {
      showToast(`Book "${loan.bookTitle}" returned successfully.`, 'success');
    }

    logActivity('Book Returned', `Loan ${loan.id} returned by ${loan.memberName}`);
    setReturnConfirmModal(false);
    setSelectedLoanToReturn(null);
  };

  // -------------------------------------------------------------
  // Member Registration Handlers
  // -------------------------------------------------------------
  const handleRegisterMember = (e) => {
    e.preventDefault();
    const errs = {};
    if (!memberForm.name.trim()) errs.name = 'Full name is required';
    if (!memberForm.username.trim()) errs.username = 'Username is required';
    if (!memberForm.password.trim() || memberForm.password.length < 4)
      errs.password = 'Password must be at least 4 chars';
    if (!memberForm.email.trim() || !memberForm.email.includes('@'))
      errs.email = 'Valid email is required';

    if (users.some((u) => u.username.toLowerCase() === memberForm.username.trim().toLowerCase())) {
      errs.username = 'Username already in use';
    }

    if (Object.keys(errs).length > 0) {
      setMemberErrors(errs);
      return;
    }

    const nextMemberNum = users.filter((u) => u.role === 'MEMBER').length + 1;
    const membershipId = `M00${nextMemberNum}`;

    const newMember = {
      id: `u_${Date.now()}`,
      username: memberForm.username.trim(),
      password: memberForm.password.trim(),
      name: memberForm.name.trim(),
      membershipId: membershipId,
      memberType: memberForm.memberType,
      maxBooks: memberForm.memberType === 'Faculty' ? 5 : 3,
      role: 'MEMBER',
      email: memberForm.email.trim()
    };

    setUsers((prev) => [...prev, newMember]);
    showToast(`Registered member ${newMember.name} (${membershipId})!`);
    logActivity('Member Registered', `${newMember.name} joined as ${newMember.memberType}`);
    setMemberModalOpen(false);
    setMemberForm({ name: '', username: '', password: '', memberType: 'Student', email: '' });
  };

  // -------------------------------------------------------------
  // Cancel Reservation Logic
  // -------------------------------------------------------------
  const handleCancelReservation = (id) => {
    setReservations((prev) =>
      prev.map((r) => (r.id === id ? { ...r, status: 'CANCELLED' } : r))
    );
    showToast('Reservation cancelled.', 'warning');
    logActivity('Reservation Cancelled', `Reservation ${id} was cancelled by librarian`);
  };

  // -------------------------------------------------------------
  // Filtered Tables
  // -------------------------------------------------------------
  const filteredBooks = useMemo(() => {
    return books.filter(
      (b) =>
        b.title.toLowerCase().includes(bookSearch.toLowerCase()) ||
        b.author.toLowerCase().includes(bookSearch.toLowerCase()) ||
        b.category.toLowerCase().includes(bookSearch.toLowerCase()) ||
        b.isbn.includes(bookSearch)
    );
  }, [books, bookSearch]);

  const { items: sortedBooks, requestSort: sortBooks, getSortIcon: getBookSortIcon } = useSortableData(filteredBooks);

  const filteredMembers = useMemo(() => {
    return users
      .filter((u) => u.role === 'MEMBER')
      .filter(
        (m) =>
          m.name.toLowerCase().includes(memberSearch.toLowerCase()) ||
          m.membershipId?.toLowerCase().includes(memberSearch.toLowerCase()) ||
          m.username.toLowerCase().includes(memberSearch.toLowerCase())
      );
  }, [users, memberSearch]);

  const { items: sortedMembers, requestSort: sortMembers, getSortIcon: getMemberSortIcon } = useSortableData(filteredMembers);

  const activeLoansList = useMemo(() => {
    return loans
      .filter((l) => l.status === 'ACTIVE')
      .filter(
        (l) =>
          l.bookTitle.toLowerCase().includes(returnSearch.toLowerCase()) ||
          l.memberName.toLowerCase().includes(returnSearch.toLowerCase()) ||
          l.id.toLowerCase().includes(returnSearch.toLowerCase())
      );
  }, [loans, returnSearch]);

  const { items: sortedActiveLoans, requestSort: sortActiveLoans, getSortIcon: getLoanSortIcon } = useSortableData(activeLoansList);

  const { items: sortedReservations, requestSort: sortReservations, getSortIcon: getResSortIcon } = useSortableData(reservations);

  return (
    <div className="space-y-8">
      {/* ─────────────────────────────────────────────────────────────
          1. DASHBOARD OVERVIEW
      ───────────────────────────────────────────────────────────── */}
      {activeTab === 'dashboard' && (
        <div className="space-y-6">
          {/* 3x2 Stat Cards Grid */}
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
            {/* Total Books */}
            <div className="glass-card glass-card-hover p-6 rounded-2xl flex flex-col justify-between">
              <div className="flex items-center justify-between text-[#CE93D8]">
                <span className="text-xs font-semibold tracking-wider uppercase">Total Books</span>
                <span className="text-xl">📚</span>
              </div>
              <div className="my-3">
                <span className="font-heading text-4xl font-extrabold text-gradient">
                  <AnimatedCount target={totalBooks} />
                </span>
              </div>
              <div className="text-xs text-[#7B6F8A] flex items-center gap-1 font-medium">
                <span>↗</span> Catalogued in system
              </div>
            </div>

            {/* Available Books */}
            <div className="glass-card glass-card-hover p-6 rounded-2xl flex flex-col justify-between">
              <div className="flex items-center justify-between text-[#CE93D8]">
                <span className="text-xs font-semibold tracking-wider uppercase">Available Copies</span>
                <span className="text-xl">✅</span>
              </div>
              <div className="my-3">
                <span className="font-heading text-4xl font-extrabold text-[#69F0AE]">
                  <AnimatedCount target={availableBooks} />
                </span>
              </div>
              <div className="text-xs text-[#7B6F8A] flex items-center gap-1 font-medium">
                <span>●</span> Ready for checkout
              </div>
            </div>

            {/* Active Loans */}
            <div className="glass-card glass-card-hover p-6 rounded-2xl flex flex-col justify-between">
              <div className="flex items-center justify-between text-[#CE93D8]">
                <span className="text-xs font-semibold tracking-wider uppercase">Active Loans</span>
                <span className="text-xl">📤</span>
              </div>
              <div className="my-3">
                <span className="font-heading text-4xl font-extrabold text-[#448AFF]">
                  <AnimatedCount target={activeLoans} />
                </span>
              </div>
              <div className="text-xs text-[#7B6F8A] flex items-center gap-1 font-medium">
                <span>🔄</span> Borrowed by members
              </div>
            </div>

            {/* Overdue Loans */}
            <div className="glass-card glass-card-hover p-6 rounded-2xl flex flex-col justify-between">
              <div className="flex items-center justify-between text-[#CE93D8]">
                <span className="text-xs font-semibold tracking-wider uppercase">Overdue Loans</span>
                <span className="text-xl">⚠️</span>
              </div>
              <div className="my-3">
                <span
                  className={`font-heading text-4xl font-extrabold ${
                    overdueLoans > 0 ? 'text-[#FF5252]' : 'text-white'
                  }`}
                >
                  <AnimatedCount target={overdueLoans} />
                </span>
              </div>
              <div className="text-xs text-[#7B6F8A] flex items-center gap-1 font-medium">
                {overdueLoans > 0 ? (
                  <span className="text-[#FF5252] font-semibold">Immediate attention needed</span>
                ) : (
                  <span>All loans in good standing</span>
                )}
              </div>
            </div>

            {/* Total Members */}
            <div className="glass-card glass-card-hover p-6 rounded-2xl flex flex-col justify-between">
              <div className="flex items-center justify-between text-[#CE93D8]">
                <span className="text-xs font-semibold tracking-wider uppercase">Total Members</span>
                <span className="text-xl">👥</span>
              </div>
              <div className="my-3">
                <span className="font-heading text-4xl font-extrabold text-gradient-purple">
                  <AnimatedCount target={totalMembers} />
                </span>
              </div>
              <div className="text-xs text-[#7B6F8A] flex items-center gap-1 font-medium">
                <span>👤</span> Students & Faculty
              </div>
            </div>

            {/* Fines Collected */}
            <div className="glass-card glass-card-hover p-6 rounded-2xl flex flex-col justify-between">
              <div className="flex items-center justify-between text-[#CE93D8]">
                <span className="text-xs font-semibold tracking-wider uppercase">Fines Settled</span>
                <span className="text-xl">💰</span>
              </div>
              <div className="my-3">
                <span className="font-heading text-4xl font-extrabold text-[#FFD740]">
                  <AnimatedCount target={finesCollected} prefix="₹" />
                </span>
              </div>
              <div className="text-xs text-[#7B6F8A] flex items-center gap-1 font-medium">
                <span>✓</span> Total revenue collected
              </div>
            </div>
          </div>

          {/* Two Bottom Side-by-Side Panels */}
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            {/* Recent Activity Feed (2 Cols) */}
            <div className="lg:col-span-2 glass-card p-6 rounded-2xl">
              <h3 className="font-heading text-base font-bold text-gradient mb-4 flex items-center gap-2">
                <span>⚡</span> Recent Activity Stream
              </h3>
              <div className="space-y-3">
                {recentActivities.map((act) => (
                  <div
                    key={act.id}
                    className="p-3 rounded-xl bg-white/[0.03] border border-white/5 flex items-center justify-between hover:bg-white/[0.06] transition-colors"
                  >
                    <div>
                      <p className="text-xs font-bold text-white">{act.action}</p>
                      <p className="text-[11px] text-[#CE93D8]/80">{act.detail}</p>
                    </div>
                    <span className="text-[10px] text-[#7B6F8A] font-semibold">{act.time}</span>
                  </div>
                ))}
              </div>
            </div>

            {/* Quick Actions Shortcuts (1 Col) */}
            <div className="glass-card p-6 rounded-2xl flex flex-col justify-between">
              <div>
                <h3 className="font-heading text-base font-bold text-gradient mb-4 flex items-center gap-2">
                  <span>🚀</span> Quick Actions
                </h3>
                <p className="text-xs text-[#7B6F8A] mb-5">
                  Frequently accessed operations for front-desk circulation.
                </p>
                <div className="space-y-3">
                  <button
                    onClick={() => setActiveTab('issue')}
                    className="btn-primary w-full py-3 px-4 text-xs font-bold flex items-center justify-center gap-2"
                  >
                    <span>📤</span> Issue Book
                  </button>
                  <button
                    onClick={() => setActiveTab('return')}
                    className="btn-secondary w-full py-3 px-4 text-xs font-bold flex items-center justify-center gap-2"
                  >
                    <span>📥</span> Return Book
                  </button>
                  <button
                    onClick={openAddBook}
                    className="btn-glass-pill w-full py-2.5 px-4 text-xs font-bold flex items-center justify-center gap-2"
                  >
                    <span>➕</span> Add New Book
                  </button>
                </div>
              </div>
              <div className="mt-6 p-3 rounded-xl bg-white/[0.02] border border-white/5 text-[11px] text-[#7B6F8A] text-center">
                Current fine rate: ₹{settings.fineRate}/day
              </div>
            </div>
          </div>
        </div>
      )}

      {/* ─────────────────────────────────────────────────────────────
          2. MANAGE BOOKS
      ───────────────────────────────────────────────────────────── */}
      {activeTab === 'books' && (
        <div className="glass-card p-6 rounded-2xl space-y-6">
          <div className="flex flex-col sm:flex-row items-center justify-between gap-4">
            <div>
              <h2 className="font-heading text-xl font-bold text-gradient">Book Inventory</h2>
              <p className="text-xs text-[#7B6F8A]">View, search, edit and register library titles</p>
            </div>
            <div className="flex items-center gap-3 w-full sm:w-auto">
              <input
                type="text"
                placeholder="Search by title, author, category..."
                value={bookSearch}
                onChange={(e) => setBookSearch(e.target.value)}
                className="w-full sm:w-64 px-4 py-2 text-xs rounded-xl bg-white/[0.06] border border-white/10 text-white outline-none focus:border-[#E040FB]"
              />
              <button
                onClick={openAddBook}
                className="btn-primary py-2 px-4 text-xs font-bold whitespace-nowrap"
              >
                + Add Book
              </button>
            </div>
          </div>

          <div className="overflow-x-auto rounded-xl">
            {sortedBooks.length === 0 ? (
              <div className="p-12 text-center text-[#7B6F8A]">
                <span className="text-4xl block mb-2">📚</span>
                <p className="text-sm">No books found matching your criteria</p>
              </div>
            ) : (
              <table>
                <thead>
                  <tr>
                    <th onClick={() => sortBooks('isbn')}>ISBN {getBookSortIcon('isbn')}</th>
                    <th onClick={() => sortBooks('title')}>Title {getBookSortIcon('title')}</th>
                    <th onClick={() => sortBooks('author')}>Author {getBookSortIcon('author')}</th>
                    <th onClick={() => sortBooks('category')}>Category {getBookSortIcon('category')}</th>
                    <th onClick={() => sortBooks('totalCopies')}>Total {getBookSortIcon('totalCopies')}</th>
                    <th onClick={() => sortBooks('availableCopies')}>Available {getBookSortIcon('availableCopies')}</th>
                    <th className="text-right">Actions</th>
                  </tr>
                </thead>
                <tbody>
                  {sortedBooks.map((book) => (
                    <tr key={book.isbn}>
                      <td className="font-mono text-xs text-[#CE93D8]">{book.isbn}</td>
                      <td className="font-semibold text-white">{book.title}</td>
                      <td className="text-[#CE93D8]/90">{book.author}</td>
                      <td>
                        <span className="px-2.5 py-1 rounded-full text-[10px] font-semibold bg-white/10 text-[#CE93D8]">
                          {book.category}
                        </span>
                      </td>
                      <td className="font-bold text-center">{book.totalCopies}</td>
                      <td className="text-center">
                        <span
                          className={
                            book.availableCopies > 0 ? 'badge-active' : 'badge-overdue'
                          }
                        >
                          {book.availableCopies} left
                        </span>
                      </td>
                      <td className="text-right space-x-2">
                        <button
                          onClick={() => openEditBook(book)}
                          className="btn-secondary px-3 py-1 text-xs"
                          data-tooltip="Edit Title"
                        >
                          Edit
                        </button>
                        <button
                          onClick={() => handleDeleteBook(book.isbn)}
                          className="btn-danger px-3 py-1 text-xs"
                          data-tooltip="Delete Title"
                        >
                          Delete
                        </button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            )}
          </div>
        </div>
      )}

      {/* ─────────────────────────────────────────────────────────────
          3. ISSUE BOOK
      ───────────────────────────────────────────────────────────── */}
      {activeTab === 'issue' && (
        <div className="max-w-2xl mx-auto glass-card p-8 rounded-2xl space-y-6">
          <div>
            <h2 className="font-heading text-xl font-bold text-gradient">Issue Book to Member</h2>
            <p className="text-xs text-[#7B6F8A]">
              Select a registered borrower and an available book copy
            </p>
          </div>

          <form onSubmit={handleIssueBook} className="space-y-5">
            {/* Member Dropdown */}
            <div>
              <label className="block text-xs font-semibold text-[#CE93D8] mb-1.5">
                Select Member *
              </label>
              <select
                value={issueMemberId}
                onChange={(e) => setIssueMemberId(e.target.value)}
                className="glass-select"
                required
              >
                <option value="">-- Choose Member --</option>
                {users
                  .filter((u) => u.role === 'MEMBER')
                  .map((m) => (
                    <option key={m.id} value={m.id}>
                      {m.name} ({m.membershipId}) — {m.memberType}
                    </option>
                  ))}
              </select>
            </div>

            {/* Book Dropdown (Copies > 0 only) */}
            <div>
              <label className="block text-xs font-semibold text-[#CE93D8] mb-1.5">
                Select Available Book *
              </label>
              <select
                value={issueBookIsbn}
                onChange={(e) => setIssueBookIsbn(e.target.value)}
                className="glass-select"
                required
              >
                <option value="">-- Choose Book --</option>
                {books
                  .filter((b) => b.availableCopies > 0)

      {/* ─────────────────────────────────────────────────────────────
          4. RETURN BOOK
      ───────────────────────────────────────────────────────────── */}

                    <th onClick={() => sortActiveLoans('issueDate')}>Issued {getLoanSortIcon('issueDate')}</th>

          <FloatingInput

      {/* ─────────────────────────────────────────────────────────────
          MODAL: RETURN BOOK CONFIRMATION
      ───────────────────────────────────────────────────────────── */}
      <Modal
        isOpen={returnConfirmModal}
        onClose={() => setReturnConfirmModal(false)}
        title="Confirm Book Return"
      >
        {selectedLoanToReturn && (() => {
          const today = getTodayStr();
          const overdueDays = getDiffDays(selectedLoanToReturn.dueDate, today);
          const isOverdue = overdueDays > 0;
          const fineAmount = isOverdue ? overdueDays * settings.fineRate : 0;

          return (
            <div className="space-y-5">
              <div className="p-4 rounded-xl bg-white/[0.04] border border-white/10 space-y-2">
                <p className="text-sm font-bold text-white">{selectedLoanToReturn.bookTitle}</p>
                <p className="text-xs text-[#CE93D8]">
                  Borrower: {selectedLoanToReturn.memberName} ({selectedLoanToReturn.membershipId})
                </p>
                <div className="flex justify-between text-xs text-[#7B6F8A] pt-2 border-t border-white/5">
                  <span>Issued: {selectedLoanToReturn.issueDate}</span>
                  <span>Due: {selectedLoanToReturn.dueDate}</span>

              {fineAmount > 0 ? (
                <div className="p-4 rounded-xl bg-red-500/[0.1] border border-red-500/20 text-center">
                  <span className="text-xs text-[#FF5252] font-bold block mb-1">
                    OVERDUE BY {overdueDays} DAYS

                  <span className="font-heading text-3xl font-extrabold text-[#FF5252]">
                    Fine: ₹{fineAmount}
                  </span>
                  <p className="text-[11px] text-[#7B6F8A] mt-1">Rate: ₹{settings.fineRate}/day</p>

              ) : (
                <div className="p-4 rounded-xl bg-green-500/[0.1] border border-green-500/20 text-center">

              <div className="flex gap-3 pt-2">
                {fineAmount > 0 ? (
                  <>
                    <button
                      onClick={() => handleConfirmReturn(false)}
                      className="btn-secondary flex-1 py-3 text-xs font-bold"
                    >
                      Return & Defer Fine
                    </button>
                    <button
                      onClick={() => handleConfirmReturn(true)}
                      className="btn-primary flex-1 py-3 text-xs font-bold"
                    >
                      Pay ₹{fineAmount} & Confirm
                    </button>
                  </>
                ) : (
                  <button
                    onClick={() => handleConfirmReturn(false)}
                    className="btn-primary w-full py-3 text-xs font-bold"
                  >
                    Confirm Return
                  </button>
                )}
              </div>
            </div>
          );
        })()}
      </Modal>

      {/* ─────────────────────────────────────────────────────────────
          MODAL: REGISTER MEMBER
      ───────────────────────────────────────────────────────────── */}
      <Modal
        isOpen={memberModalOpen}
        onClose={() => setMemberModalOpen(false)}
        title="Register New Member"
      >
        <form onSubmit={handleRegisterMember} className="space-y-4">
          <FloatingInput
            label="Full Name"
            value={memberForm.name}
            onChange={(e) => setMemberForm({ ...memberForm, name: e.target.value })}
            error={memberErrors.name}
            required
          />
          <FloatingInput
            label="Username"
            value={memberForm.username}
            onChange={(e) => setMemberForm({ ...memberForm, username: e.target.value })}
            error={memberErrors.username}
            required
          />
          <FloatingInput
            label="Password"
            type="password"
            value={memberForm.password}
            onChange={(e) => setMemberForm({ ...memberForm, password: e.target.value })}
            error={memberErrors.password}
            required
          />
          <FloatingInput
            label="Email Address"
            type="email"
            value={memberForm.email}
            onChange={(e) => setMemberForm({ ...memberForm, email: e.target.value })}
            error={memberErrors.email}
            required
          />
          <div>
            <label className="block text-xs font-semibold text-[#CE93D8] mb-1">

              value={memberForm.memberType}

          </div>
          <button type="submit" className="btn-primary w-full py-3 text-xs font-bold uppercase mt-4">
            Register Member
